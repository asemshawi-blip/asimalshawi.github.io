<style>
:root{--navy:#0f2742;--bg:#f4f6fa;--card:#fff;--text:#1b2a3b;--muted:#64748b;--line:#e2e8f0;--run:#2563eb;--late:#dc2626;--plan:#d97706;--done:#16a34a}
*{box-sizing:border-box}

.dashStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 18px}.dashStat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:0 3px 12px #0f274208}.dashStat span{display:block;color:var(--muted);font-size:13px}.dashStat b{display:block;font-size:24px;color:var(--navy)}.dashTools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 14px}.dashTools h2{margin:0}.dashSearch{max-width:360px;margin:0;background:#fff}@media(max-width:680px){.dashStats{grid-template-columns:repeat(2,1fr)}.dashTools{align-items:stretch;flex-direction:column}.dashSearch{max-width:none}}

.sst{display:flex;gap:4px;margin:12px 0}.sst>div{flex:1;text-align:center;font-size:12px;color:var(--muted)}.sst i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:#e3e9ef;color:#647589;font-style:normal;font-weight:700}.sst .dn i{background:#16a34a;color:#fff}.sst .cur{font-weight:700;color:var(--text,#182b3d)}.sst .cur i{background:#ed8700;color:#fff;box-shadow:0 0 0 4px #ed870033}.sinfo{background:#eff6ff;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e3e9ef;border-radius:12px;padding:12px;margin:8px 0;background:#fff;cursor:pointer;text-align:right;width:100%;font:inherit;color:inherit}

async function sign(paths){

async function shrink(f){
  if(!f.type||!f.type.startsWith("image/")||/gif|svg/.test(f.type)||f.size<120*1024)return f;
  /* يجرب 3 مستويات ويقف عند أول ناتج ≤ 180 كيلوبايت */
  const LV=[[1280,.72],[1100,.62],[960,.52]],TARGET=180*1024;
  const out=(c,q)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));
  const enc=async(src,w,h)=>{let best=null;
    for(const [M,q] of LV){const k=Math.min(1,M/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
      const b=await out(c,q);c.width=c.height=0;if(b&&(!best||b.size<best.size))best=b;if(b&&b.size<=TARGET)break}
    return best};
  let b=null;
  try{const bmp=await createImageBitmap(f,{imageOrientation:"from-image"});try{b=await enc(bmp,bmp.width,bmp.height)}finally{if(bmp.close)bmp.close()}}catch(e){}
  if(!b){const u=URL.createObjectURL(f);try{const im=new Image();im.src=u;await im.decode();b=await enc(im,im.naturalWidth,im.naturalHeight)}catch(e){}finally{URL.revokeObjectURL(u)}}
  return b&&b.size<f.size?new File([b],"photo.jpg",{type:"image/jpeg"}):f;
}
const isNetErr=e=>/fetch|network|load failed|timeout|abort|offline/i.test(String((e&&e.message)||e));

  return path;
}

const wStatus=()=>{const t=wSum(S.works);return {t,d:r2(WTOT-t)}};

function wSplit(total,n){const base=Math.floor(total/n*100)/100,a=Array(n).fill(base);a[n-1]=r2(total-base*(n-1));return a}
const wDone=async(msg)=>{await loadW();wSync(S.projects.find(x=>x.id===S.cur));S.wmsg={p:S.cur,t:msg};render();mToast(msg+" · "+wStatusText())};
async function delW(id){
  const it=S.works.find(x=>x.id===id);if(!it)return;
  if(!confirm(`حذف البند «${it.name}» (وزنه ${wFmt(it.weight)} نقطة)؟`))return;
  logA("work","حذف بند: "+it.name);
  const {error}=await sb.from("work_items").delete().eq("id",id);if(error)return alert(error.message);
  await wDone(`تم حذف «${it.name}» (وزنه ${wFmt(it.weight)})`);
}
async function setWt(id,v){
  const i=S.works.find(x=>x.id===id),x=parseFloat(v);if(!i)return;if(!(x>=0)){alert("اكتب وزناً صحيحاً");return render()}
  const {error}=await sb.from("work_items").update({weight:r2(x)}).eq("id",id);if(error){alert(error.message);return render()}
  logA("work",`وزن ${i.name}: ${i.weight} ← ${r2(x)}`);i.weight=r2(x);await wDone(`تم تعديل وزن «${i.name}»`);

async function renW(id){
  const i=S.works.find(x=>x.id===id);if(!i)return;const n=prompt("اسم البند",i.name);if(n==null||!n.trim()||n.trim()===i.name)return;

async function renP(k){
  const f=[...new Set(S.works.map(x=>x.phase))][k];if(f==null)return;const n=prompt("اسم البند الرئيسي",f);if(n==null||!n.trim()||n.trim()===f)return;
  const {error}=await sb.from("work_items").update({phase:n.trim()}).eq("project_id",S.cur).eq("phase",f);if(error)return alert(error.message);
  logA("work",`تعديل اسم مرحلة: ${f} ← ${n.trim()}`);S.works.forEach(x=>{if(x.phase===f)x.phase=n.trim()});render();

async function scaleW(){
  const W=S.works,t=wSum(W);if(!t)return;
  if(!confirm(`سيتم تعديل أوزان كل البنود بالتناسب ليصبح المجموع 100 (الحالي ${wFmt(t)}). متابعة؟`))return;
  const ws=W.map(i=>r2(i.weight*WTOT/t));ws[ws.length-1]=r2(ws[ws.length-1]+r2(WTOT-ws.reduce((a,b)=>a+b,0)));
  const r=await Promise.all(W.map((i,k)=>sb.from("work_items").update({weight:ws[k]}).eq("id",i.id)));
  const er=r.find(q=>q.error);if(er)return alert(er.error.message);
  W.forEach((i,k)=>i.weight=ws[k]);logA("work","إعادة توزيع الأوزان لتصبح 100");await wDone("تم توزيع الأوزان لتصبح 100");
}
/* نموذج إضافة بند رئيسي + فروعه */
const wfInit=()=>S.wf=S.wf||{ph:"",pw:"",rows:[{n:"",w:""}]};
function wfPlan(){
  const f=wfInit(),num=v=>{const x=parseFloat(v);return x>0?x:0},rows=f.rows.filter(r=>r.n.trim());
  const ex=r2(rows.reduce((s,r)=>s+num(r.w),0)),blank=rows.filter(r=>!num(r.w)),pw=num(f.pw);
  const avail=r2((pw||WTOT-wSum(S.works))-ex);let sh=[],warn="";
  if(blank.length){
    if(avail>0)sh=wSplit(avail,blank.length);
    else{sh=blank.map(()=>1);warn=pw?"وزن البند الرئيسي مستهلك بالكامل بالفروع المحددة؛ سيأخذ كل فرع بلا وزن نقطة واحدة، عدّلها بعد الحفظ.":"لا يوجد متبقٍ من 100؛ سيأخذ كل فرع بلا وزن نقطة واحدة، ويمكنك تعديل الأوزان أو الضغط على «وزّع تلقائياً» بعد الحفظ."}
  }else if(pw&&Math.abs(avail)>0.001)warn=`مجموع الفروع ${wFmt(ex)} لا يساوي وزن البند الرئيسي ${wFmt(pw)}.`;
  else if(!pw&&avail<-0.001)warn=`الأوزان تتجاوز المتاح من 100 بمقدار ${wFmt(-avail)} نقطة.`;
  let k=0;return {items:rows.map(r=>num(r.w)?{n:r.n.trim(),w:num(r.w),auto:false}:{n:r.n.trim(),w:sh[k++],auto:true}),warn};
}
function wfPrevHtml(){
  const P=wfPlan(),d=wStatus().d;
  return `المتاح حالياً من 100: <b>${wFmt(Math.max(d,0))}</b> نقطة`+(P.items.length?"<br>"+P.items.map(x=>`${esc(x.n)}: <b>${wFmt(x.w)}</b>${x.auto?" (تلقائي)":""}`).join(" · "):"")+(P.warn?`<br>⚠️ ${esc(P.warn)}`:"");
}
function wfPrev(){const e=$("wfPrev");if(e)e.innerHTML=wfPrevHtml()}
function wfRow(i,k,v){S.wf.rows[i][k]=v;wfPrev()}
function wfAdd(){S.wf.rows.push({n:"",w:""});render()}
function wfDel(i){S.wf.rows.splice(i,1);render()}
async function addW(){
  const f=wfInit(),ph=f.ph.trim();if(!ph)return alert("اكتب البند الرئيسي (المرحلة)");
  const P=wfPlan();if(!P.items.length)return alert("أضف بنداً فرعياً واحداً على الأقل");
  let n=Math.max(-1,...S.works.map(x=>x.sort||0))+1;
  const rows=P.items.map(x=>({project_id:S.cur,phase:ph,name:x.n,weight:x.w,sort:n++}));
  const {error}=await sb.from("work_items").insert(rows);if(error)return alert(error.message);
  logA("work",`إضافة بند رئيسي: ${ph} (${rows.length} فرعي)`);S.wf=null;await wDone(`تمت إضافة «${ph}» و${rows.length} بند فرعي`);
}
async function moveP(i,d){
  const ph=[...new Set(S.works.map(x=>x.phase))],j=i+d;if(j<0||j>=ph.length)return;
  [ph[i],ph[j]]=[ph[j],ph[i]];let n=0;const ch=[];
  ph.forEach(f=>S.works.filter(x=>x.phase===f).forEach(x=>{if(x.sort!==n)ch.push([x,n]);n++}));
  const r=await Promise.all(ch.map(([x,k])=>sb.from("work_items").update({sort:k}).eq("id",x.id)));
  const er=r.find(q=>q.error);if(er)return alert(er.error.message);
  ch.forEach(([x,k])=>x.sort=k);S.works.sort((a,b)=>a.sort-b.sort);render();
}

    <div class="bar ${pc===100?"s-done":"s-run"}"><i style="width:${pc}%"></i></div><div class="lbl">وزن المرحلة ${wFmt(w)} نقطة (${tot?Math.round(w/tot*1000)/10:0}% من المشروع)</div>

  const form=adm?`<div class="box"><b>إضافة بند رئيسي وبنوده الفرعية</b>
    <input id="wph" list="wphl" placeholder="البند الرئيسي (المرحلة)" value="${esc(f.ph)}" oninput="S.wf.ph=this.value"><datalist id="wphl">${ph.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    <input type="number" min="0" step="any" placeholder="وزن البند الرئيسي بالنقاط (اختياري)" value="${esc(f.pw)}" oninput="S.wf.pw=this.value;wfPrev()">

    ${f.rows.map((r,i)=>`<div style="display:flex;gap:6px;align-items:center"><input style="flex:1;margin:4px 0" placeholder="البند الفرعي" value="${esc(r.n)}" oninput="wfRow(${i},'n',this.value)"><input type="number" min="0" step="any" style="width:90px;margin:4px 0" placeholder="تلقائي" value="${esc(r.w)}" oninput="wfRow(${i},'w',this.value)">${f.rows.length>1?`<button class="sm del" style="margin:0" onclick="wfDel(${i})" aria-label="حذف الفرع">✕</button>`:""}</div>`).join("")}
    <button class="btn alt" onclick="wfAdd()">＋ بند فرعي</button>
    <div id="wfPrev" class="hlq">${wfPrevHtml()}</div>
    <button class="btn" onclick="addW()">حفظ البند وفروعه</button></div>`:"";

/* ===== الإشعارات ===== */
const VAPID_PUBLIC="BO0Nn0gRZtyZmGyf_kTbN_r70ucgvAOcPkS8HFIlh_AcsezhqC21Qu3uKhRSO5JwLJrImuHyzUMpdA_XNw3Go8U";
const b64=s=>{s=(s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const isMob=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
const pushBtn=()=>("PushManager" in window&&isMob()&&!S.pushOn)?'<button class="sm" onclick="enablePush()">🔔 تفعيل الإشعارات</button>':"";
const pushSave=sub=>{const j=sub.toJSON();return sb.rpc("push_save",{e:j.endpoint,k:j.keys.p256dh,a:j.keys.auth})};
async function checkPush(){
  try{if(!("PushManager" in window)||Notification.permission!=="granted")return;
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await pushSave(sub);S.pushOn=true;render()}}catch(e){}
}
async function enablePush(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),st=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(ios&&!st)return alert("في الآيفون: افتح الموقع من Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية، ثم افتح التطبيق من الشاشة الرئيسية وفعّل الإشعارات");
  if(!("PushManager" in window))return alert("هذا المتصفح لا يدعم الإشعارات");
  if(VAPID_PUBLIC.startsWith("PUT_"))return alert("مفتاح الإشعارات غير مضبوط بعد");
  try{
    if(await Notification.requestPermission()!=="granted")return alert("لم يتم السماح بالإشعارات. فعّلها من إعدادات الموقع في المتصفح");
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC)});
    const {error}=await pushSave(sub);if(error)throw error;
    S.pushOn=true;render();alert("تم تفعيل الإشعارات على هذا الجهاز")
  }catch(e){alert("تعذر تفعيل الإشعارات: "+(e.message||e))}
}
async function deepLink(p,t){
  const q=new URLSearchParams(location.search);p=p||q.get("p");t=t||q.get("t");
  const mq=q.get("m");
  if(mq&&mSee()){history.replaceState(null,"",location.pathname);if(!MT.t.some(x=>x.id===mq))await loadM();if(MT.t.some(x=>x.id===mq)){S.cur=null;S.view=null;await mOpen(mq);return true}}
  if(!p&&t==="maint"&&mSee()){history.replaceState(null,"",location.pathname);S.cur=null;S.view=null;S.modal=null;await loadM();render();scrollTo(0,0);return true}
  const pr=p&&S.projects.find(x=>String(x.id)===String(p));if(!pr)return false;
  S.modal=null;await openP(pr.id);
  if(t&&TABS.some(x=>x.k===t&&x.see.includes(S.role)))await setTab(t);
  history.replaceState(null,"",location.pathname);return true;
}

function rpPreset(k){
  const t=day0(new Date()),p=S.projects.find(x=>x.id===S.cur);let f=t,e=t;
  if(k==="7")f=addDays(t,-6);else if(k==="14")f=addDays(t,-13);
  else if(k==="m")f=new Date(t.getFullYear(),t.getMonth(),1);

  else if(k==="all")f=p?.start_date?new Date(p.start_date+"T00:00:00"):addDays(t,-365);
  $("rpf").value=iso(f);$("rpt").value=iso(e);
}

  if(p.price!=null&&p.price!==""&&Number(p.price)>0)return {v:p.price,ap:""};

}

function rpCheck(cfg){

  return "";

  const cfg=rpReadCfg(),er=rpCheck(cfg);if(er)return alert(er);

  catch(e){S.rep={...cfg,phase:"form"};if(e.message!=="cancel")alert("تعذر إنشاء التقرير: "+(e.message||e));render()}

/* صفوف رُفعت معًا بنفس النص (صورة لكل صف): الأول فقط يحمل النص ويُعلَّم الباقي _dup */

function rpWriteBlocks(txt){

    if(l.startsWith("# "))out.push(`<div class="wh">${esc(l.slice(2))}</div>`);

  }

function rpCutAt(t,max){

  if(i<max*.5)i=w.lastIndexOf(" ");if(i<max*.3)i=max-1;return i+1;
}

  if(Number.isInteger(n)&&n<=10)return x+(h?" ساعات":" أيام");return x+(h?" ساعة":" يوماً")};

async function rpPdf(p,cfg,pages,prog){

const MPRI={urgent:["مستعجل","#dc2626"],high:["عاجل","#ea580c"],normal:["عادي","#94a3b8"]};
const MOUT={done:"تم التسليم",nowork:"لا يحتاج عمل",rejected:"أُلغي الطلب"};

const mPhOpts=v=>["before","during","after","inspect","material","defect","handover"].map(k=>`<option value="${k}" ${k===v?"selected":""}>${MPT[k][0]}</option>`).join("");
const MPH={issue:"المشكلة",before:"قبل",during:"أثناء العمل",after:"بعد",other:"صور"};
let MT={t:[],e:[],q:{},sm:[],o:[],oerr:"",id:null,err:"",rep:null};
const mNo=t=>"MNT-"+String(t.no||0).padStart(4,"0");
const mSee=()=>["owner","pm","mgmt","site"].includes(S.role),mCreateOk=()=>["owner","pm"].includes(S.role),mAdm=()=>["owner","pm"].includes(S.role);
const mT=id=>MT.t.find(x=>x.id===id),mNow=()=>new Date().toISOString();
/* المرحلة الحالية (الطلبات القديمة بمرحلة "work" تُعرض كتنفيذ) */
const mStg=t=>t.closed_at?"deliver":(t.stage==="work"?"exec":(t.stage==="review"&&t.review_at?"approved":(MST.some(s=>s[0]===t.stage)?t.stage:"new")));
/* من ينتظره الطلب الآن */
const mWho=t=>{if(t.closed_at)return"";const s=mStg(t);if(s==="cost"&&t.mgmt_status==="pending")return"mgmt";return{new:"site",inspect:"site",review:"pm",approved:"pm",price:"site",cost:"pm",exec:"site"}[s]||""};
const mMine=t=>{const w=mWho(t);return !!w&&w!=="mgmt"&&(w==="pm"?mAdm():S.role===w)};
const mCan=t=>{const w=mWho(t);return !!w&&w!=="mgmt"&&(mAdm()||S.role===w)};
const mCost=t=>t.cost_total!=null&&t.cost_total!==""?t.cost_total:(MT.q[t.id]?MT.q[t.id].total:null);
/* من اعتمد التكلفة: مدير المشروع/المالك (cost_ok_by) أو الإدارة (mgmt_by) */
const mApprover=t=>{if(t.mgmt_status==="approved")return{n:t.mgmt_by||t.cost_ok_by||"",r:t.cost_ok_role||"الإدارة",at:t.mgmt_at||t.cost_ok_at};if(t.cost_ok_at)return{n:t.cost_ok_by||"",r:t.cost_ok_role||"مدير المشروع",at:t.cost_ok_at};return null};
const mApprTxt=t=>{const a=mApprover(t);return a?(a.n?esc(a.n)+" · ":"")+esc(a.r)+" · "+dfmt(a.at):""};
const mDur=t=>t.work_qty?(+t.work_qty)+" "+(t.work_unit==="h"?"ساعة":"يوم"):"-";
const mMeName=()=>(S.me&&S.me.name)||(S.user.email||"").split("@")[0]||ROLES[S.role]||"";
const mAge=t=>{const h=(Date.now()-new Date(t.stage_at||t.created_at))/36e5;return h<1?"الآن":h<24?"منذ "+Math.floor(h)+" ساعة":"منذ "+Math.floor(h/24)+" يوم"};
const mErr=e=>{const m=(e&&e.message)||String(e||"");alert(/column|schema cache/i.test(m)?(/contractor_phone/i.test(m)?"شغّل supabase/maintenance_contractor_phone.sql في Supabase أولاً.":(/cost_ok_by|cost_ok_role|mgmt_by|rq_/.test(m)?"يلزم تشغيل ملف reno_approvals.sql في Supabase أولاً.":"يلزم تشغيل ملف maintenance_v2.sql في Supabase أولاً."))+"\n\n"+m:m)};
const mCover=t=>{const e=MT.e.find(e=>e.ticket_id===t.id&&e.file_path&&(e.file_type||"").startsWith("image"));return e?e.file_path:null};
const mShow=t=>!t.closed_at||(Date.now()-new Date(t.closed_at))<30*864e5;   /* المغلقة تظهر في الرئيسية 30 يوما */
const mCol=t=>t.closed_at?"done":(mStg(t)==="exec"?"run":"plan");
function mToast(m){const d=document.createElement("div");d.className="mtoast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function mOnce(fn){if(mOnce.b)return;mOnce.b=1;try{await fn()}finally{mOnce.b=0}}

async function loadM(){
  if(!mSee())return;
  if(!S.me){try{const r=await sb.from("profiles").select("name").eq("id",S.user.id).maybeSingle();S.me=(r&&r.data)||{}}catch(e){S.me={}}}
  const [a,b,quotes]=await Promise.all([sb.from("mnt_requests").select("*").order("created_at",{ascending:false}).limit(1000),sb.from("mnt_events").select("*").order("created_at",{ascending:false}).limit(5000),sb.from("mnt_quotes").select("ticket_id,items,subtotal,vat,total,updated_at,status,note").limit(1000)]);
  if(a.error||b.error||quotes.error){MT.err=(a.error||b.error||quotes.error).message;MT.t=[];MT.e=[];return}
  MT.err="";MT.t=a.data||[];MT.e=(b.data||[]).reverse();MT.q={};
  (quotes.data||[]).forEach(q=>MT.q[q.ticket_id]=q);
  if(mCreateOk()){const {data:sm}=await sb.rpc("mnt_sites");MT.sm=sm||[]}
  try{const ob=await sb.from("mnt_obstacles").select("*").order("created_at",{ascending:true}).limit(5000);MT.o=ob.error?[]:(ob.data||[]);MT.oerr=ob.error?ob.error.message:""}catch(e){MT.o=[];MT.oerr=String((e&&e.message)||e)}
  try{const rp=await sb.from("mnt_obstacle_replies").select("*").order("created_at",{ascending:true}).limit(5000);MT.or=rp.error?[]:(rp.data||[]);MT.orerr=rp.error?rp.error.message:""}catch(e){MT.or=[];MT.orerr=String((e&&e.message)||e)}
  await sign(MT.t.filter(mShow).map(mCover).concat(MT.o.map(o=>o.file_path)).filter(Boolean));
}
function mPush(t,title,body,roles){try{sb.rpc("maint_notify",{p_project:"",p_ticket:t.id,p_roles:roles,p_title:title,p_body:String(body||"").slice(0,200)}).then(()=>{},()=>{})}catch(e){}}
async function mRequestSiteUpdate(id){
  if(!mAdm())return;

  if(!t.assignee_id&&!t.assignee)return alert("لا يوجد مدير موقع معيّن لهذا الطلب.");
  const {error}=await sb.rpc("maint_notify",{p_project:"",p_ticket:t.id,p_roles:["site"],p_title:"🔔 مطلوب تحديث طلب الصيانة "+mNo(t),p_body:"يرجى تحديث حالة الطلب: "+(t.branch||"")+" · "+(t.title||"")});

  mToast("تم إشعار مدير الموقع بطلب تحديث الحالة");

async function mEvent(t,kind,body,phase,file){
  const row={ticket_id:t.id,kind,phase:phase||null,body:body||null,author_role:ROLES[S.role]};
  if(file){row.file_path=file.path;row.file_type=file.type}
  const {error}=await sb.from("mnt_events").insert(row);if(error)alert(error.message);return !error;
}
/* تحديث الطلب: يحفظ، يشعر الأدوار المعنية، يعيد التحميل، ويغلق النافذة (إلا إذا keep) */
async function mUpd(id,patch,ev,roles,pt,o){
  o=o||{};const t=mT(id);if(!t)return false;
  if(patch.stage&&patch.stage!==t.stage)patch.stage_at=mNow();
  const {error}=await sb.from("mnt_requests").update(patch).eq("id",id);
  if(error){mErr(error);return false}
  if(ev)await mEvent(t,"stage",ev);
  if(roles&&roles.length)mPush(t,pt||("صيانة "+mNo(t)),o.body||ev,roles);
  await loadM();if(!o.keep)S.modal=null;render();if(o.toast)mToast(o.toast);return true;
}
async function mUploadFiles(t,fs,phase){
  let n=0;
  for(const f of fs){
    if((f.type||"").startsWith("video/")){alert("الفيديو غير متاح في الصيانة");continue}
    const path=await up("maint",f);if(!path)continue;
    if(await mEvent(t,"photo",null,phase,{path,type:f.type||"image/jpeg"}))n++;
  }
  return n;
}
const mHasPic=(id,ph)=>MT.e.some(e=>e.ticket_id===id&&e.phase===ph&&e.file_path);

  const s=mStg(t),idx=MST.findIndex(x=>x[0]===s),col=mCol(t),pr=MPRI[t.priority]||MPRI.normal,mine=mMine(t),cp=mCover(t),u=cp&&S.urls[cp];

async function mCreate(){await mOnce(async()=>{
  const br=$("nbr").value.trim(),title=$("ntt").value.trim(),ds=$("nds").value.trim(),as=$("nas").value,site=MT.sm.find(x=>String(x.user_id)===String(as)),cpv=$("ncp")?.value.trim()||"",cpn=normP(cpv);
  if(!br)return alert("اكتب اسم الفرع");if(!title)return alert("اكتب المشكلة");if(!site)return alert("اختر مدير الموقع");if(cpv&&!cpn)return alert("رقم جوال المقاول غير صحيح، اكتبه مع رمز الدولة بدون + أو أصفار، مثال: 9665XXXXXXXX");
  const b=$("nbt");b.disabled=true;b.textContent="جاري الإرسال...";
  const urgent=$("nur").checked;
  const row={branch:br,title,descr:ds||title,category:"other",priority:urgent?"urgent":"normal",place:null,created_by:S.user.id,created_by_role:ROLES[S.role],stage:"new",assignee_id:site.user_id,assignee:site.name,pm_name:($("npm")?.value||"").trim()||mMeName()};
  if(cpn)row.contractor_phone=cpn; const amv=($("nam")?.value||"").trim(),apv=($("nap")?.value||"").trim(),apn=normP(apv),mpv=($("nmp")?.value||"").trim();
  if(apv&&!apn){b.disabled=false;b.textContent="إرسال الطلب";return alert("رقم جوال مدير المنطقة غير صحيح، اكتبه مع رمز الدولة بدون + أو أصفار، مثال: 9665XXXXXXXX")}
  if(amv)row.area_name=amv;if(apn)row.area_phone=apn;if(mpv)row.map_url=mpv;

const mPics=(id,ph)=>{const L=MT.e.filter(e=>e.ticket_id===id&&ph.includes(e.phase)&&e.file_path&&S.urls[e.file_path]&&(e.file_type||"").startsWith("image"));return L.length?`<div class="mpics">${L.map(e=>`<img class="mth" src="${S.urls[e.file_path]}" onclick="openImg(this.src)" alt="">`).join("")}</div>`:""};

  }else if(s==="review"){
    h=desc+rep+mPics(id,["before"])+(can?`<label class="lbl">إذا رغبت بالتوجيه، اكتب المطلوب من مدير الموقع</label><textarea id="mri" rows="3" placeholder="مثال: عالج التسرب، أصلح السقف، وصوّر بعد التنفيذ"></textarea><div class="mbtns">${big("✔ اعتماد المعاينة فقط وإشعار المدير",`mReviewOnly('${id}')`,"#0e7490")}${big("📨 اعتماد وتوجيه لمدير الموقع",`mReviewRoute('${id}')`,"#16a34a")}<button class="btn alt" onclick="mReviewBack('${id}')">↩ إرجاع بملاحظة</button><button class="btn danger" onclick="mNoWork('${id}')">لا يحتاج عمل</button></div>`:wait);
  }else if(s==="approved"){

  }else if(s==="price"){
    h=back+rep+(can?`<label class="lbl">التكلفة (ر.س) *</label><input id="mcost" type="number" inputmode="decimal" min="0" step="any" value="${esc(t.cost_total??"")}" class="mcin" placeholder="0"><label class="lbl">ملاحظة (اختياري)</label><input id="msc" value="${esc(t.scope||"")}" placeholder="مثال: تشمل المواد والعمالة">${big("📤 إرسال التكلفة للاعتماد",`mPriceSend('${id}')`)}`:wait);
  }else if(s==="cost"){

/* ---------- الرد والتوجيه على العائق ---------- */
const mObsDirOk=()=>["owner","pm"].includes(S.role);
const mObsRepMine=r=>!!r.author_id&&!!S.user&&r.author_id===S.user.id;
function mObsRepHtml(o,t){
  if(MT.orerr)return mObsDirOk()?`<div class="hlq">الرد والتوجيه غير مفعّلين بعد: شغّل ملف mnt_obstacle_replies.sql في Supabase.</div>`:"";
  const R=(MT.or||[]).filter(r=>String(r.obstacle_id)===String(o.id));
  const list=R.map(r=>{const d=r.kind==="directive";return `<div class="mor${d?" dir":""}"><b>${d?"📌 توجيه":"↩ رد"} · ${esc(r.author_role||"")} · ${dfmt(r.created_at)}</b><div class="mpre">${esc(r.body||"")}</div>${S.role==="owner"||mObsRepMine(r)?`<button class="sm del" onclick="mObsRepDel('${r.id}')">🗑 حذف</button>`:""}</div>`}).join("");
  const box=mObsAddOk()&&!t.closed_at?`<textarea id="mor_${o.id}" rows="2" placeholder="${mObsDirOk()?"اكتب ردك أو توجيهك على هذا العائق...":"اكتب ردك على هذا العائق..."}"></textarea><div class="mbtns"><button class="btn alt" onclick="mObsReply('${o.id}','reply')">↩ إرسال رد</button>${mObsDirOk()?`<button class="btn" style="background:#ed8700" onclick="mObsReply('${o.id}','directive')">📌 إرسال كتوجيه</button>`:""}</div>`:"";
  return list||box?`<div class="morw">${list}${box}</div>`:"";
}
async function mObsReply(oid,kind){await mOnce(async()=>{
  const o=(MT.o||[]).find(x=>String(x.id)===String(oid));if(!o)return;
  const t=mT(o.ticket_id),b=($("mor_"+oid)?.value||"").trim();
  if(!b)return alert(kind==="directive"?"اكتب التوجيه":"اكتب الرد");
  if(kind==="directive"&&!mObsDirOk())return;
  const {error}=await sb.from("mnt_obstacle_replies").insert({obstacle_id:o.id,ticket_id:o.ticket_id,body:b,kind,author_role:ROLES[S.role]});
  if(error)return alert(/relation|schema cache|does not exist/i.test(error.message)?"شغّل ملف mnt_obstacle_replies.sql في Supabase أولاً.":error.message);
  const dir=kind==="directive";
  mPush(t,(dir?"📌 توجيه على عائق ":"↩ رد على عائق ")+mNo(t),t.branch+" · "+b,dir?["site"]:(S.role==="site"?["owner","pm"]:["site"]));
  await loadM();render();mToast(dir?"أُرسل التوجيه":"أُرسل الرد");
})}
async function mObsRepDel(id){
  const r=(MT.or||[]).find(x=>String(x.id)===String(id));
  if(!r||!(S.role==="owner"||mObsRepMine(r)))return;
  if(!confirm("حذف هذا الرد نهائياً؟"))return;
  await mOnce(async()=>{
    const {data,error}=await sb.from("mnt_obstacle_replies").delete().eq("id",id).select("id");
    if(error)return alert(error.message);
    if(!data||!data.length)return alert("ما تم الحذف: ما عندك صلاحية لحذف هذا الرد.");
    await loadM();render();mToast("حُذف الرد");
  });
}
async function mObsAdd(id){await mOnce(async()=>{
  const t=mT(id),b=($("mob")?.value||"").trim(),f=($("mobf")?.files||[])[0];
  if(!b)return alert("اكتب العائق");
  const row={ticket_id:id,body:b,author_role:ROLES[S.role]};
  if(f){if(!(f.type||"").startsWith("image/"))return alert("الصور فقط");const path=await up("maint",f);if(path){row.file_path=path;row.file_type=f.type||"image/jpeg"}}
  const {error}=await sb.from("mnt_obstacles").insert(row);
  if(error)return alert(/relation|schema cache|does not exist/i.test(error.message)?"شغّل ملف migrate_maintenance_v3.sql في Supabase أولاً.":error.message);
  mPush(t,"🚧 عائق جديد "+mNo(t),t.branch+" · "+b,S.role==="site"?["owner","pm"]:["site"]);
  await loadM();render();mToast("أُضيف العائق");

async function mObsRes(id,v){await mOnce(async()=>{

async function mEditSave(id){await mOnce(async()=>{
  const t=mT(id),g=k=>($(k)?.value||"").trim();
  const title=g("mef_t"),br=g("mef_b"),ap=normP(g("mef_ph")),cp=normP(g("mef_cp"));
  if(g("mef_ph")&&!ap)return alert("رقم جوال مدير المنطقة غير صحيح، اكتبه مع رمز الدولة بدون + أو أصفار، مثال: 9665XXXXXXXX");
  if(g("mef_cp")&&!cp)return alert("رقم جوال المقاول غير صحيح، اكتبه مع رمز الدولة بدون + أو أصفار، مثال: 9665XXXXXXXX");
  if(!title||!br)return alert("العنوان والفرع مطلوبان");
  const s=$("mef_s").value,i=mIdx(s),cs=g("mef_c"),cost=cs===""?null:+cs,now=mNow();
  if(cs!==""&&!(cost>=0))return alert("التكلفة غير صحيحة");
  const p={title,branch:br,descr:g("mef_d")||title,diagnosis:g("mef_g")||null,contractor:g("mef_k")||null,contractor_phone:cp||null,receiver:g("mef_r")||null,pm_name:g("mef_pm")||null,area_name:g("mef_am")||null,area_phone:ap||null,map_url:g("mef_mp")||null,stage:s,back_note:null};
  if(i<3){p.cost_total=null;p.scope=null;p.priced_at=null}else{p.cost_total=cost;p.priced_at=cost==null?null:(t.priced_at||now)}
  if(i<5){p.cost_ok_at=null;p.cost_ok_by=null;p.cost_ok_role=null;p.mgmt_by=null;p.mgmt_status=null;p.mgmt_note=null;p.mgmt_token=null;p.mgmt_at=null}
  else{p.cost_ok_at=t.cost_ok_at||now}
  if(i<5){p.started_at=null;p.work_qty=null;p.work_unit=null}
  if(i===6){p.closed_at=t.closed_at||now;p.outcome="done";p.close_note=g("mef_cr")||null}else{p.closed_at=null;p.outcome=null;p.close_note=g("mef_cr")||null}   /* لا نمسح تقرير الإنجاز عند حفظ مرحلة غير التسليم */
  const ok=await mUpd(id,p,"عُدّل الطلب يدوياً · المرحلة: "+MST[i][1],null,null,{keep:true,toast:"تم الحفظ ✔"});
  if(!ok)return;
  if(p.cost_total==null)await sb.from("mnt_quotes").delete().eq("ticket_id",id).then(()=>{},()=>{});
  else await sb.from("mnt_quotes").upsert({ticket_id:id,items:[{d:"إجمالي أعمال الصيانة",q:1,u:p.cost_total}],subtotal:p.cost_total,vat:0,total:p.cost_total,updated_at:now,status:i>=5?"approved":"pending",note:p.scope||null},{onConflict:"ticket_id"}).then(()=>{},()=>{});
  MT.edit=null;await loadM();render();
})}

/* ===== تنظيف الصور اليتيمة (ملفات في التخزين لا يشير إليها أي سجل) — للمدير فقط ===== */
const ORPH_GRACE_H=24;   // لا نلمس الملفات الأحدث من 24 ساعة (قد تكون قيد الرفع)
function fmtSz(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1)+" ميجا":Math.max(1,Math.round(n/1024))+" كيلوبايت"}
function openOrph(){S.orph={st:"idle",list:[],bytes:0,total:0,msg:""};modal("orph")}
async function listAllFiles(){
  const bk=sb.storage.from("media"),files=[];
  const page=async prefix=>{const out=[];for(let o=0;;o+=1000){
    const {data,error}=await bk.list(prefix,{limit:1000,offset:o,sortBy:{column:"name",order:"asc"}});
    if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break}return out};
  const top=await page("");
  for(const it of top){
    if(it.id){files.push({path:it.name,size:it.metadata?.size||0,at:it.created_at||it.updated_at});continue}
    for(const f of await page(it.name)){if(f.id)files.push({path:it.name+"/"+f.name,size:f.metadata?.size||0,at:f.created_at||f.updated_at})}
  }
  return files;
}
async function scanOrph(){
  S.orph={st:"scan",list:[],bytes:0,total:0,msg:""};render();
  try{
    const refs=new Set();
    for(let o=0;;o+=1000){
      const {data,error}=await sb.from("entries").select("file_path").not("file_path","is",null).range(o,o+999);
      if(error)throw error;(data||[]).forEach(e=>refs.add(e.file_path));if(!data||data.length<1000)break}
    const {data:pr,error:pe}=await sb.from("projects").select("cover_path");if(pe)throw pe;
    for(const tb of ["mnt_events","maint_events","mnt_obstacles","quote_offers"])for(let o=0;;o+=1000){   /* صور الصيانة (الجديد + الأرشيف القديم): إذا الجدول غير موجود نتجاهله، وأي خطأ آخر يوقف الفحص */
      const {data,error}=await sb.from(tb).select("file_path").not("file_path","is",null).range(o,o+999);
      if(error){if(/does not exist|schema cache|PGRST205|42P01/i.test(error.message+(error.code||"")))break;throw error}
      (data||[]).forEach(e=>refs.add(e.file_path));if(!data||data.length<1000)break}
    (pr||[]).forEach(p=>{if(p.cover_path)refs.add(p.cover_path)});
    const files=await listAllFiles(),now=Date.now();
    const orph=files.filter(f=>!refs.has(f.path)&&(!f.at||now-new Date(f.at).getTime()>ORPH_GRACE_H*3600e3));
    /* حماية: إذا ما وجدنا أي مرجع إطلاقا والتخزين فيه ملفات، غالبا الصلاحيات ناقصة، لا نعرض شيئا للحذف */
    if(!refs.size&&files.length)throw new Error("لم تُقرأ سجلات الملفات (تحقق من الصلاحيات). تم إيقاف التنظيف للأمان.");
    S.orph={st:"ready",list:orph,bytes:orph.reduce((s,f)=>s+f.size,0),total:files.length,msg:""};
  }catch(e){S.orph={st:"idle",list:[],bytes:0,total:0,msg:"تعذر الفحص: "+(e.message||e)}}
  render();
}
async function delOrph(){
  const O=S.orph;if(!O.list.length)return;
  if(!confirm(`حذف ${O.list.length} ملف يتيم (${fmtSz(O.bytes)}) نهائيا؟ لا يمكن التراجع.`))return;
  S.orph={...O,st:"del"};render();
  let ok=0,err="";
  for(let i=0;i<O.list.length;i+=100){
    const ch=O.list.slice(i,i+100).map(f=>f.path);
    const {data,error}=await sb.storage.from("media").remove(ch);
    if(error){err=error.message;break}ok+=(data||[]).length}
  logA("entry",`تنظيف الصور اليتيمة: حُذف ${ok} ملف (${fmtSz(O.bytes)})`,null);
  S.orph={st:"done",list:[],bytes:0,total:0,msg:err?`حُذف ${ok} ثم توقف: ${err}`:`تم حذف ${ok} ملف وتحرير ${fmtSz(O.bytes)} ✅`};
  render();
}
function orphHtml(){
  const O=S.orph||{st:"idle",list:[],bytes:0,msg:""};
  let body;
  if(O.st==="scan"||O.st==="del")body=`<p class="lbl">${O.st==="scan"?"جاري فحص التخزين...":"جاري الحذف..."}</p>`;
  else if(O.st==="ready")body=O.list.length
    ?`<p>وُجد <b>${O.list.length}</b> ملف يتيم (من أصل ${O.total}) بحجم <b>${fmtSz(O.bytes)}</b>.</p><p class="lbl">هذه ملفات لا يرتبط بها أي تقرير أو ملاحظة أو غلاف مشروع، ومرّ عليها أكثر من ${ORPH_GRACE_H} ساعة.</p><button class="btn danger" onclick="delOrph()">🗑 حذف الملفات اليتيمة</button>`
    :`<p>لا توجد ملفات يتيمة 👌 (فُحص ${O.total} ملف).</p>`;
  else body=`${O.msg?`<p>${esc(O.msg)}</p>`:`<p class="lbl">يفحص كل ملفات التخزين ويعرض ما لا يرتبط بأي سجل قبل الحذف.</p>`}<button class="btn" onclick="scanOrph()">${O.st==="done"?"فحص مرة أخرى":"فحص الآن"}</button>`;
  return `<div class="modal"><div class="box"><h3>🧹 تنظيف المساحة</h3>${body}<div style="margin-top:14px"><button class="btn alt" onclick="modal(null)">إغلاق</button></div></div></div>`;
}

/* ===== طابور الرفع بدون إنترنت (IndexedDB) ===== */
const QDB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("pm-queue",1);r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction("q",m),r=f(t.objectStore("q"));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{put:v=>tx("readwrite",s=>s.put(v)),all:()=>tx("readonly",s=>s.getAll()),del:id=>tx("readwrite",s=>s.delete(id)),clear:()=>tx("readwrite",s=>s.clear())};
})();
async function qAdd(it,noRender){
  it.id=crypto.randomUUID();it.ts=Date.now();
  try{await QDB.put(it)}catch(e){alert("تعذر الحفظ على الجهاز: "+(e&&e.message||e));if(!noRender)render();return}
  await qUpd();
  alert("لا يوجد اتصال مستقر. حُفظ العنصر على جهازك وسيُرفع تلقائيا عند عودة الإنترنت.");
  if(!noRender)render();
}
async function qUpd(){
  let n=0;try{n=(await QDB.all()).length}catch(e){}
  let b=$("qb");
  if(!n){if(b)b.remove();return}
  if(!b){b=document.createElement("div");b.id="qb";b.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:#102944;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 8px 24px #0004;font-size:14px";document.body.appendChild(b)}
  b.innerHTML=`<span>⏳ ${n} عنصر بانتظار الرفع${navigator.onLine?"":" (لا يوجد اتصال)"}</span><span><button class="sm" onclick="syncQ()">رفع الآن</button> <button class="sm" onclick="qClear()">حذف المعلّق</button></span>`;
}
async function qClear(){if(!confirm("حذف كل العناصر المعلّقة من الجهاز دون رفعها؟"))return;try{await QDB.clear()}catch(e){}qUpd()}
async function syncQ(){
  if(syncQ.b||!navigator.onLine||!S.user)return;syncQ.b=true;let ok=0;
  try{
    const L=(await QDB.all()).sort((a,b)=>a.ts-b.ts);
    for(const it of L){
      const base={project_id:it.project_id,kind:it.kind,author_role:it.author_role},rows=[],ups=[];let bad=false;
      if(!it.files.length)rows.push({...base,body:it.body,file_path:null,file_type:null});
      else for(const f of it.files){const path=await up(it.project_id,f,true);if(!path||path==="NET"){bad=true;break}ups.push(path);rows.push({...base,body:it.body,file_path:path,file_type:f.type,...(it.bax||{})})}
      if(bad){if(ups.length)await sb.storage.from("media").remove(ups);break}
      const {error}=await sb.from("entries").insert(rows);
      if(error){if(ups.length)await sb.storage.from("media").remove(ups);break}
      await QDB.del(it.id);ok++;
      logA("entry",`${(TABS.find(x=>x.k===it.kind)||{}).n||""}: ${it.files.length?it.files.length+" ملف":String(it.body||"").slice(0,60)} (رُفع بعد عودة الاتصال)`,it.project_id);
    }
  }catch(e){}
  finally{syncQ.b=false}
  await qUpd();
  if(ok){
    if(S.cur&&S.tab!=="works"){try{await loadE()}catch(e){}}
    const ae=document.activeElement;if(!S.modal&&!(ae&&/TEXTAREA|INPUT|SELECT/.test(ae.tagName)))render();
  }
}

async function loadPS(){
  S.sites=[];S.ps=[];S.siteErr="";
  if(!["owner","pm"].includes(S.role)||!S.cur)return;
  try{
    let sites=[];
    // 1) site_managers view
    try{
      const {data,error}=await sb.from("site_managers").select("*").order("created_at");
      if(!error && data && data.length) sites=data;
      else if(error) S.siteErr=error.message;
    }catch(e){ S.siteErr=String(e&&e.message||e); }
    // 2) fallback: profiles where role=site
    if(!sites.length){
      try{
        const {data,error}=await sb.from("profiles").select("*").eq("role","site").order("created_at");
        if(!error && data && data.length){
          sites=data.map(p=>({user_id:p.id, id:p.id, name:p.name||p.username||"مدير موقع", username:p.username||"", created_at:p.created_at||""}));
        }
      }catch(e){}
    }
    // 3) fallback: RPC list_users
    if(!sites.length){
      try{
        const {data,error}=await sb.rpc("list_users");
        if(!error && data){
          const filtered=data.filter(u=>u.role==="site");
          if(filtered.length){
            sites=filtered.map(u=>({user_id:u.id, id:u.id, name:u.username||u.name||"مدير موقع", username:u.username||"", created_at:u.created_at||""}));
          }
        }
      }catch(e){}
    }
    S.sites=sites||[];
    const {data:psData, error:psErr}=await sb.from("project_sites").select("user_id").eq("project_id",S.cur);
    if(psErr) S.siteErr=(S.siteErr?S.siteErr+" | ":"")+psErr.message;
    S.ps=(psData||[]).map(x=>x.user_id);
  }catch(e){
    S.siteErr=String(e.message||e);
    S.sites=[];S.ps=[];
  }
}

init();

<script src="i18n.js"></script>

<!-- ===== وكيل المشاريع الذكي - Groq + fallback خفيف ===== -->
<style>
#agentBtn{position:fixed;bottom:20px;left:20px;z-index:9999;width:60px;height:60px;border-radius:50%;background:#0f2742;color:#fff;border:2px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Tajawal,Tahoma,sans-serif}
#agentBtn span{font-size:10px;position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:2px 7px;border-radius:10px;white-space:nowrap}
#agentPanel{position:fixed;bottom:92px;left:20px;z-index:9999;width:min(390px,calc(100vw - 32px));height:min(580px,calc(100vh - 130px));background:#fff;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.30);display:none;flex-direction:column;overflow:hidden;font-family:Tajawal,Tahoma,sans-serif;direction:rtl;border:1px solid #e2e8f0}
#agentPanel.open{display:flex}
.agentHead{background:#0f2742;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.agentHead b{font-size:15px}.agentHead span{font-size:12px;opacity:.8;display:block;margin-top:2px}
.agentClose{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.agentBody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f4f6fa}
.aMsg{max-width:90%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.aMsg.user{background:#0f2742;color:#fff;align-self:flex-start;border-bottom-right-radius:4px}
.aMsg.ai{background:#fff;border:1px solid #e2e8f0;align-self:flex-end;border-bottom-left-radius:4px}
.aConfirm{background:#fffbeb;border:1px solid #d97706;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.75}
.aConfirm b{color:#92400e}
.aBtns{display:flex;gap:8px;margin-top:10px}
.aBtn{flex:1;padding:11px;border-radius:10px;border:0;cursor:pointer;font-weight:700;font-family:inherit;font-size:14px}
.aBtn.ok{background:#16a34a;color:#fff}.aBtn.no{background:#e2e8f0;color:#1b2a3b}
.aQuick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:#f4f6fa}
.aQuick button{border:1px solid #e2e8f0;background:#fff;padding:7px 11px;border-radius:20px;font-size:12.5px;cursor:pointer;font-family:inherit}
.agentInput{display:flex;gap:8px;padding:12px;border-top:1px solid #e2e8f0;background:#fff}
.agentInput input{flex:1;padding:11px 12px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;outline:none}
.agentInput button{background:#0f2742;color:#fff;border:0;padding:0 18px;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit}
.aTyping{font-size:12px;color:#64748b;padding:0 14px 6px;background:#f4f6fa;display:none}
.aBadge{font-size:11px;background:#ecfdf5;color:#166534;padding:3px 8px;border-radius:10px;margin-right:6px}
@media(max-width:480px){#agentBtn{bottom:16px;left:16px}#agentPanel{left:16px;right:16px;width:auto;bottom:88px}}
</style>
<script>
(function(){
  // رابط الـ Edge Function حق مشروعك نفسه - جاهز، لا تعدله
  const EDGE_URL = "https://wmavitpimbcjohcjgqhz.supabase.co/functions/v1/ai-agent";
  function ready(fn){ if(typeof S !== "undefined" && typeof sb !== "undefined") fn(); else setTimeout(()=>ready(fn),300); }
  ready(function(){
    const HISTORY_KEY='pm_agent_history_v3_smart';
    const btn=document.createElement('button'); btn.id='agentBtn'; btn.innerHTML='🤖<span>الوكيل الذكي</span>'; btn.title='وكيل المشاريع الذكي';
    document.body.appendChild(btn);
    const panel=document.createElement('div'); panel.id='agentPanel';
    panel.innerHTML=`<div class="agentHead"><div><b>🤖 وكيل المشاريع <span class="aBadge">ذكي • Groq</span></b><span>تشاوره بأي صيغة، ويشاورك قبل أي تعديل</span></div><button class="agentClose">✕</button></div><div class="agentBody" id="agentBody"></div><div class="aQuick"><button data-q="وش رايك في وضع مشاريعي اليوم؟">وش رايك في وضعي؟</button><button data-q="وش المتأخر اليوم؟">المتأخر</button><button data-q="سوي لي تقرير المدير حق اليوم">تقرير المدير</button></div><div class="aTyping" id="aTyping">الوكيل الذكي يفكر...</div><div class="agentInput"><input id="agentInput" placeholder="شاوره بأي صيغة... مثل: هل أأجل مشروع الرياض؟" /><button id="agentSend">إرسال</button></div>`;
    document.body.appendChild(panel);
    const bodyEl=panel.querySelector('#agentBody'), inputEl=panel.querySelector('#agentInput'), typingEl=panel.querySelector('#aTyping');
    let isOpen=false, busy=false;
    function save(){ try{ localStorage.setItem(HISTORY_KEY, bodyEl.innerHTML); }catch(e){} }
    function loadHist(){ try{ const h=localStorage.getItem(HISTORY_KEY); if(h){ bodyEl.innerHTML=h; bodyEl.scrollTop=bodyEl.scrollHeight; return true; } }catch(e){} return false; }
    function addMsg(t,who='ai'){ const d=document.createElement('div'); d.className='aMsg '+who; d.textContent=t; bodyEl.appendChild(d); bodyEl.scrollTop=bodyEl.scrollHeight; save(); }
    function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    btn.onclick=()=>{ isOpen=!isOpen; panel.classList.toggle('open',isOpen); if(isOpen && !bodyEl.children.length && !loadHist()){ addMsg('هلا فيك 👋\nأنا الحين ذكي، مو حافظ أوامر.\n\nشاورني بأي صيغة تبي:\n• "وش رايك أأجل مشروع الرياض؟"\n• "هل مشروع جدة متعثر ولا ماشي؟"\n• "قارن بين مشروع الرياض وجدة، وش أبدأ فيه؟"\n• "سجل معوق لمشروع الرياض: تأخر التوريد"\n\nأي تعديل بيشاورك قبل ما أنفذه.','ai'); } };
    panel.querySelector('.agentClose').onclick=()=>{ panel.classList.remove('open'); isOpen=false; };
    panel.querySelectorAll('.aQuick button').forEach(b=> b.onclick=()=>{ inputEl.value=b.dataset.q; send(); });

    function buildContext(){
      const projs=(S.projects||[]).map(p=>({id:p.id,name:p.name,loc:p.loc,due:p.due,start_date:p.start_date,progress:p.progress,status:p.status,ptype:p.ptype,contractor_name:p.contractor_name,site_manager:p.site_manager,price:p.price}));
      const cur = S.cur ? projs.find(x=>x.id===S.cur) : null;
      return {
        today: new Date().toISOString().slice(0,10),
        role: S.role,
        projects: projs,
        currentProject: cur,
        currentEntries: (S.entries||[]).slice(0,25).map(e=>({kind:e.kind,body:e.body,created_at:e.created_at,author_role:e.author_role})),
        currentWorks: (S.works||[]).slice(0,40).map(w=>({phase:w.phase,name:w.name,weight:w.weight,pct:w.pct}))
      };
    }

    async function send(){
      const text=inputEl.value.trim(); if(!text||busy) return;
      inputEl.value=''; addMsg(text,'user');
      if(!S.user){ addMsg('سجل دخول أول عشان أشوف مشاريعك.','ai'); return; }
      busy=true; typingEl.style.display='block';
      try{
        // 1) حاول العقل الذكي أولاً
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(EDGE_URL, { method:'POST', headers:{'Content-Type':'application/json','apikey':SBK,'Authorization':'Bearer ' + (session?.access_token || SBK)}, body: JSON.stringify({ message:text, context:buildContext(), history: bodyEl.innerText.slice(-2500) }) });
        const data = await res.json();
        typingEl.style.display='none'; busy=false;
        if(data.reply) addMsg(data.reply,'ai');
        if(data.action && data.needsConfirmation) showConfirm(data.action);
        else if(data.action && data.action.type==='open_project'){ try{ goP(data.action.data.project_id); }catch(e){} }
      }catch(e){
        // 2) إذا الذكي مو مركب بعد، طح للوضع الخفيف ولا تترك المستخدم بدون رد
        typingEl.style.display='none'; busy=false;
        addMsg('⚠️ الوضع الذكي مو شغال الحين — يبدو أن Edge Function مو مركبة بعد أو مفتاح Groq مو محفوظ.\n\nركبها من ملف index.ts اللي عطيتك إياه (دقيقتين)، وبعدها أرد عليك كذكي.\n\nالحين برد عليك بالوضع الخفيف:','ai');
        localFallback(text);
      }
    }

    // --- Fallback خفيف إذا الذكي مو مركب ---
    function localFallback(text){
      const projs=S.projects||[];
      if(/متأخر/.test(text)){
        const late=projs.filter(p=>{ try{ const t=timing(p); return t&&t.late; }catch(e){return false;} });
        addMsg(late.length? 'المتأخرة: '+late.map(p=>p.name+' — '+timing(p).t).join('\n') : 'ما عندك متأخرة 🎉','ai'); return;
      }
      if(/تقرير.*مدير|مدير.*تقرير/.test(text)){
        addMsg('تقرير المدير — '+new Date().toLocaleDateString('ar')+'\n'+projs.slice(0,8).map(p=>'• '+p.name+' — '+ (p.progress??0)+'% — تسليم '+(p.due||'-')).join('\n'),'ai'); return;
      }
      addMsg('فهمت عليك، بس عشان أرد عليك كذكي بأي صيغة، ركب Edge Function أولاً. وبعدها شاورني بأي كلام عادي.','ai');
    }

    function kindLabel(k){ const m={notes:'ملاحظة',coord:'تنسيق',issues:'معوق',reports:'تقرير',media:'صورة'}; return m[k]||k; }
    function showConfirm(action){
      const desc = action.description || (action.type+' - '+JSON.stringify(action.data||{}));
      const wrap=document.createElement('div');
      wrap.innerHTML=`<div class="aConfirm"><b>📋 أتأكد منك قبل التنفيذ:</b><br>${esc(desc)}<div class="aBtns"><button class="aBtn ok" data-a="ok">✅ نفذ</button><button class="aBtn no" data-a="no">❌ إلغاء</button></div></div>`;
      bodyEl.appendChild(wrap); bodyEl.scrollTop=bodyEl.scrollHeight; save();
      wrap.querySelector('[data-a="ok"]').onclick=async ()=>{
        wrap.querySelectorAll('button').forEach(b=>b.disabled=true);
        try{
          const ok = await executeAction(action);
          if(ok) addMsg('تم ✅ نفذت اللي اتفقنا عليه.','ai'); else addMsg('ما قدرت أنفذ. تأكد من الصلاحيات.','ai');
        }catch(e){ addMsg('ما قدرت أنفذ: '+(e.message||e),'ai'); }
        save();
      };
      wrap.querySelector('[data-a="no"]').onclick=()=>{ wrap.querySelectorAll('button').forEach(b=>b.disabled=true); addMsg('تمام، لغيتها. ما صار أي تعديل.','ai'); save(); };
    }

    async function executeAction(action){
      const d=action.data||{};
      if(action.type==='add_entry'){
        const {error}=await sb.from('entries').insert({project_id:d.project_id, kind:d.kind||'notes', body:d.body, author_role:(window.ROLES&&ROLES[S.role])||S.role});
        if(!error){ try{ if(window.logA) logA('entry', kindLabel(d.kind)+': '+String(d.body||'').slice(0,60), d.project_id); }catch(e){} try{ if(S.cur===d.project_id && window.loadE) await loadE(); if(window.render) render(); }catch(e){} }
        return !error;
      }
      if(action.type==='update_project_progress'){
        const {error}=await sb.from('projects').update({progress:d.progress}).eq('id',d.project_id);
        if(!error){ const p=S.projects.find(x=>x.id===d.project_id); if(p) p.progress=d.progress; try{ if(window.render) render(); }catch(e){} }
        return !error;
      }
      if(action.type==='update_project'){
        const {error}=await sb.from('projects').update(d.updates||{}).eq('id',d.project_id);
        if(!error){ const p=S.projects.find(x=>x.id===d.project_id); if(p) Object.assign(p,d.updates||{}); try{ if(window.render) render(); }catch(e){} }
        return !error;
      }
      if(action.type==='create_project'){
        const {error}=await sb.from('projects').insert(d);
        if(!error){ try{ await load(); }catch(e){} }
        return !error;
      }
      return false;
    }

    panel.querySelector('#agentSend').onclick=send;
    inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  });
})();
</script>
<!-- ===== نهاية وكيل المشاريع الذكي ===== -->
