<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المشاريع</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المشاريع">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0f2742;--bg:#f4f6fa;--card:#fff;--text:#1b2a3b;--muted:#64748b;--line:#e2e8f0;--run:#2563eb;--late:#dc2626;--plan:#d97706;--done:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--text)}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;margin:4px 0 10px;background:#fff}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.wrap{max-width:1200px;margin:auto;padding:20px}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:19px}.hb{display:flex;gap:8px;align-items:center}.rl{font-size:13px;opacity:.85}
.sm{background:#ffffff26;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer}
.sm.del{background:#fee2e2;color:var(--late);margin-top:6px}
.btn{background:var(--run);color:#fff;border:0;padding:11px 22px;border-radius:10px;cursor:pointer;font-weight:700;margin:4px 0}
.btn:disabled{opacity:.6;cursor:wait}.btn.alt{background:#475569}.btn.danger{background:var(--late)}
.back{background:none;border:0;color:var(--run);font-weight:700;cursor:pointer;padding:0 0 12px}
.s-run{--c:var(--run)}.s-plan{--c:var(--plan)}.s-done{--c:var(--done)}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}.top h2{margin:0;font-size:22px}
/* الأعمدة الثلاثة */
.cols{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.dashStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 18px}.dashStat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:0 3px 12px #0f274208}.dashStat span{display:block;color:var(--muted);font-size:13px}.dashStat b{display:block;font-size:24px;color:var(--navy)}.dashTools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 14px}.dashTools h2{margin:0}.dashSearch{max-width:360px;margin:0;background:#fff}@media(max-width:680px){.dashStats{grid-template-columns:repeat(2,1fr)}.dashTools{align-items:stretch;flex-direction:column}.dashSearch{max-width:none}}
.col{background:#e9eef5;border-radius:18px;padding:12px;border-top:6px solid var(--c)}
.col h3{margin:4px 4px 12px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.col h3 b{background:var(--c);color:#fff;border-radius:20px;padding:0 12px;font-size:15px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0f274214;cursor:pointer;margin-bottom:12px}
.img{height:170px;background:linear-gradient(135deg,#cbd5e1,#94a3b8) center/cover;position:relative}
.cw{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;color:#fff}
.chip.ty{background:#334155}
.wa{background:#25d366;color:#fff;border-radius:10px;padding:11px 18px;text-decoration:none;font-weight:700;font-size:15px}
.chip.ok{background:var(--done)}.chip.late{background:var(--late)}
.body{padding:14px}.body h4{margin:0 0 2px;font-size:19px}.body p{margin:0;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;margin:12px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
/* صفحة المشروع */
.banner{height:280px;border-radius:18px;background:linear-gradient(135deg,#cbd5e1,#94a3b8) center/cover;position:relative}
.box{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 14px #0f274210}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:14px 0}
.det span{display:block;font-size:13px;color:var(--muted)}.det b{font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:24px;cursor:pointer;font-weight:500}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lbl{font-size:13px;color:var(--muted)}
.item{border-bottom:1px solid var(--line);padding:12px 0}.item small{color:var(--muted);display:block;margin-top:6px}
.item img,.item video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:8px}
.item img{cursor:zoom-in}
.lb{position:fixed;inset:0;background:#000d;z-index:99;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lbx{position:absolute;top:14px;left:14px;background:#ffffff33;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.note,.empty{text-align:center;color:var(--muted);padding:22px}
.login{max-width:380px;margin:50px auto}.msg{color:var(--late);font-size:14px;min-height:20px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto}
.link{white-space:pre-wrap;background:#eff6ff;padding:10px;border-radius:10px;word-break:break-all;font-size:13px;direction:ltr;text-align:left}
@media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="note">جاري التحميل...</div></div>
<script>
/* ===== 1) الإعدادات ===== */
const SBU="https://wmavitpimbcjohcjgqhz.supabase.co",SBK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtYXZpdHBpbWJjam9oY2pncWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODg4MDQsImV4cCI6MjEwNjk2NDgwNH0.sR6dTymzM2TgclddArsdMfuxEZ3rTADB2Ti796X8d5Y";
const sb=supabase.createClient(SBU,SBK);
const sb2=supabase.createClient(SBU,SBK,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});   // لإنشاء حسابات الآخرين
const UD="asemshawi-blip.github.io";   // نطاق داخلي لاسم المستخدم
const ROLES={owner:"المالك",pm:"مدير مشروع",mgmt:"الإدارة",contr:"المقاول",site:"مدير الموقع"};
const ST={plan:["التصميم","s-plan"],run:["قيد التنفيذ","s-run"],done:["تم التسليم","s-done"]};
/* see = من يشاهد ، add = من يضيف (المالك فقط يحذف) */
const TABS=[
{k:"notes",n:"ملاحظات الإدارة",see:"owner,pm,mgmt",add:"owner,pm,mgmt",ph:"اكتب ملاحظة..."},
{k:"talks",n:"المناقشات",see:"owner,pm,contr,site",add:"owner,pm,contr,site",ph:"اكتب رسالة..."},
{k:"issues",n:"المعوقات والملاحظات",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site",ph:"اكتب المعوق أو الملاحظة..."},
{k:"reports",n:"التقارير",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site",ph:"عنوان التقرير وملخصه...",file:"*/*"},
{k:"media",n:"الصور والفيديوهات",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site",ph:"وصف (اختياري)",file:"image/*,video/*",multi:1}];
let S={user:null,role:"none",projects:[],cur:null,tab:"notes",entries:[],urls:{},modal:null,link:"",wl:{obs:[],notes:[]},sites:[],ps:[],q:""};

/* ===== 2) مساعدات ===== */
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(100,parseInt(v)||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stOpts=v=>Object.keys(ST).map(k=>`<option value="${k}" ${k===v?"selected":""}>${ST[k][0]}</option>`).join("");
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const daysBetween=(a,b)=>a&&b?Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5):"";
const inv=()=>new URLSearchParams(location.search).get("invite");
const money=v=>v==null||v===""?"-":Number(v).toLocaleString("en-US");
/* متأخر / على الموعد + عداد الأيام (لا يظهر بعد التسليم) */
function timing(p){
  if(p.status==="done"||!p.due)return null;
  const d=Math.round((new Date(p.due+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
  return d<0?{late:1,t:`متأخر ${-d} يوم`}:{late:0,t:d===0?"على الموعد · التسليم اليوم":`على الموعد · باقي ${d} يوم`};
}
const TYN={new:"إنشاء",reno:"ترميم"},TYE={new:"🏗",reno:"🛠"};
const chip=p=>{const t=timing(p),y=TYN[p.ptype]?TYE[p.ptype]+" "+TYN[p.ptype]:"";return t||y?`<div class="cw">${t?`<span class="chip ${t.late?"late":"ok"}">${t.t}</span>`:""}${y?`<span class="chip ty">${y}</span>`:""}</div>`:""};
const normP=v=>{const d=String(v).replace(/\D/g,"").replace(/^00/,"");return d.length>=10&&!d.startsWith("0")?d:""};
const wa=(ph,m)=>"https://wa.me/"+ph+"?text="+encodeURIComponent(m);

/* ===== 3) الدخول ===== */
async function init(){
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null;
  S.user?boot():loginView();
}
function loginView(msg=""){
  $("app").innerHTML=`<div class="login box"><h2>${inv()?"قبول الدعوة":"تسجيل الدخول"}</h2>
  <input id="em" type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" autocomplete="username" autocapitalize="none" dir="ltr">
  <input id="pw" type="password" placeholder="كلمة المرور (6 أحرف فأكثر)" onkeydown="if(event.key==='Enter')signIn()">
  <div class="msg">${msg}</div><button class="btn" onclick="signIn()">دخول</button>
  ${inv()?'<button class="btn alt" onclick="signUp()">إنشاء حساب جديد</button>':""}</div>`;
}
async function signIn(){
  let em=$("em").value.trim();if(!em.includes("@"))em=em.toLowerCase()+"@"+UD;
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:$("pw").value});
  if(error)return loginView("البريد أو كلمة المرور غير صحيحة");
  S.user=data.user;boot();
}
async function signUp(){
  const {data,error}=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
  if(error)return loginView(esc(error.message));
  if(!data.session)return loginView("تم إنشاء الحساب. أكّد بريدك ثم افتح رابط الدعوة مرة ثانية وسجّل دخول.");
  S.user=data.user;boot();
}
async function out(){await sb.auth.signOut();location.href=location.pathname}
async function boot(){
  if(inv()){await sb.rpc("accept_invite",{t:inv()});history.replaceState(null,"",location.pathname)}
  const {data:p}=await sb.from("profiles").select("role").eq("id",S.user.id).single();
  S.role=p?.role||"none";
  await load();
  if(isMg()){await loadWelcome();S.modal="welcome";render()}
}

/* ===== 4) البيانات والملفات ===== */
async function load(){
  const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});
  if(error)alert("تعذر تحميل المشاريع: "+error.message);
  S.projects=(data||[]).map(p=>({...p,status:ST[p.status]?p.status:"run"}));   // حالة "متأخر" القديمة تتحول لقيد التنفيذ
  await sign(S.projects.map(p=>p.cover_path));
  render();
}
async function sign(paths){
  const need=[...new Set(paths.filter(x=>x&&!S.urls[x]))];
  if(!need.length)return;
  const {data}=await sb.storage.from("media").createSignedUrls(need,7200);
  (data||[]).forEach(d=>{if(d.signedUrl)S.urls[d.path]=d.signedUrl});
}
async function up(pid,f){
  const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
  const path=`${pid}/${crypto.randomUUID()}.${ext}`;
  const {error}=await sb.storage.from("media").upload(path,f,{contentType:f.type||"application/octet-stream"});
  if(error){alert("فشل الرفع: "+error.message);return null}
  return path;
}
async function loadE(){
  const {data}=await sb.from("entries").select("*").eq("project_id",S.cur).eq("kind",S.tab).order("created_at",{ascending:false});
  S.entries=data||[];await sign(S.entries.map(e=>e.file_path));
}

/* ===== 5) العرض ===== */
function render(){
  const hd=`<header><h1>إدارة المشاريع</h1><div class="hb"><span class="rl">${ROLES[S.role]||""}</span>
  ${S.role==="owner"?`<button class="sm" onclick="openUsers()">الحسابات</button>`:""}${isMg()?`<button class="sm" onclick="openWelcome()">التنبيهات${S.wl.obs.length?" ("+S.wl.obs.length+")":""}</button>`:""}<button class="sm" onclick="out()">خروج</button></div></header>`;
  const b=S.role==="none"?'<div class="box note">حسابك بدون صلاحيات. استخدم رابط الدعوة اللي وصلك.</div>':S.cur?proj():home();
  $("app").innerHTML=hd+'<div class="wrap">'+b+'</div>'+(S.modal?modalHtml():"");
}
function card(p){
  const u=S.urls[p.cover_path];
  return `<div class="card ${ST[p.status][1]}" data-search="${esc((String(p.name||"")+" "+String(p.loc||"")).toLocaleLowerCase())}" onclick="openP('${p.id}')"><div class="img" ${u?`style="background-image:url('${u}')"`:""}>${chip(p)}</div>
  <div class="body"><h4>${esc(p.name)}</h4><p>${esc(p.loc)}</p><div class="bar"><i style="width:${clamp(p.progress)}%"></i></div>
  <div class="row"><span>الإنجاز ${clamp(p.progress)}%</span><span>التسليم ${esc(p.due)||"-"}</span></div></div></div>`;
}
function home(){
  const total=S.projects.length,active=S.projects.filter(p=>p.status==="plan"||p.status==="run").length,late=S.projects.filter(p=>timing(p)?.late).length,done=S.projects.filter(p=>p.status==="done").length;
  const stats=`<div class="dashStats"><div class="dashStat"><span>إجمالي المشاريع</span><b>${total}</b></div><div class="dashStat"><span>قيد العمل</span><b>${active}</b></div><div class="dashStat"><span>متأخرة</span><b>${late}</b></div><div class="dashStat"><span>تم تسليمها</span><b>${done}</b></div></div>`;
  const cols=Object.keys(ST).map(k=>{
    const L=S.projects.filter(p=>p.status===k);
    return `<section class="col ${ST[k][1]}"><h3>${ST[k][0]}<b>${L.length}</b></h3>${L.map(card).join("")}<div class="empty" data-empty-for="${k}" style="${L.length?"display:none":""}">${S.q?"لا توجد نتائج مطابقة":"لا توجد مشاريع"}</div></section>`;
  }).join("");
  return `<div class="dashTools"><h2>المشاريع</h2><input class="dashSearch" id="projectSearch" type="search" value="${esc(S.q)}" placeholder="ابحث بالاسم أو الموقع" aria-label="ابحث عن مشروع بالاسم أو الموقع" oninput="filterProjects(this.value)">${["owner","pm"].includes(S.role)?`<button class="btn" onclick="modal('new')">＋ مشروع جديد</button>`:""}</div>${stats}<div class="cols">${cols}</div>`;
}
function filterProjects(value){
  S.q=value.trim().toLocaleLowerCase();
  document.querySelectorAll(".col").forEach(col=>{let count=0;col.querySelectorAll(".card[data-search]").forEach(c=>{const show=c.dataset.search.includes(S.q);c.style.display=show?"":"none";if(show)count++});const empty=col.querySelector(".empty");if(empty){empty.style.display=count?"none":"block";empty.textContent=S.q?"لا توجد نتائج مطابقة":"لا توجد مشاريع"}});
}
async function openP(id){
  S.cur=id;S.tab=TABS.find(t=>t.see.includes(S.role)).k;
  await loadE();await loadPS();render();scrollTo(0,0);
}
async function setTab(k){S.tab=k;await loadE();render()}
function fileHtml(e){
  const u=S.urls[e.file_path];if(!u)return"";
  const t=e.file_type||"";
  if(t.startsWith("image"))return `<img src="${u}" loading="lazy" onclick="openImg(this.src)">`;
  if(t.startsWith("video"))return `<video src="${u}" controls preload="metadata"></video>`;
  return `<p><a href="${u}" target="_blank" rel="noopener">📎 فتح الملف</a></p>`;
}
function proj(){
  const p=S.projects.find(x=>x.id===S.cur);if(!p){S.cur=null;return home()}
  const T=TABS.filter(t=>t.see.includes(S.role)),t=TABS.find(x=>x.k===S.tab),own=S.role==="owner",ed=own||S.role==="pm",u=S.urls[p.cover_path];
  const det=`<div class="box det">
    <div><span>الحالة</span><b>${ST[p.status][0]}</b></div>
    <div><span>نوع المشروع</span><b>${TYN[p.ptype]||"-"}</b></div>
    <div><span>مدير المشروع</span><b>${esc(p.pm_name)||"-"}</b></div>
    <div><span>المقاول</span><b>${esc(p.contractor_name)||"-"}</b></div>
    <div><span>مدير المنطقة</span><b>${esc(p.area_name)||"-"}</b></div>
    ${["owner","pm","site"].includes(S.role)?tel("جوال المقاول",p.contractor_phone)+tel("جوال مدير المنطقة",p.area_phone):""}
    <div><span>مدير الموقع</span><b>${esc(p.site_manager)||"-"}</b></div>
    <div><span>تاريخ البداية</span><b>${esc(p.start_date)||"-"}</b></div>
    <div><span>تاريخ التسليم</span><b>${esc(p.due)||"-"}</b></div>
    ${!["contr","site"].includes(S.role)?`<div><span>السعر</span><b>${money(p.price)}</b></div>`:""}</div>`;
  const cm=`بخصوص مشروع «${p.name}»${p.loc?" ("+p.loc+")":""}`;
  const toPM=p.pm_phone&&["owner","mgmt","contr","site"].includes(S.role)?`<a class="wa" target="_blank" rel="noopener" href="${wa(p.pm_phone,`السلام عليكم${p.pm_name?" "+p.pm_name:""}،\nأتواصل معك ${cm}.`)}">📲 تواصل مع مدير المشروع</a>`:"";
  const toCT=p.contractor_phone&&["owner","pm","site"].includes(S.role)?`<a class="wa" target="_blank" rel="noopener" href="${wa(p.contractor_phone,`السلام عليكم${p.contractor_name?" "+p.contractor_name:""}،\nأتواصل معكم ${cm}.`)}">📲 تواصل مع المقاول</a>`:"";
  const toAM=p.area_phone&&["owner","pm","site"].includes(S.role)?`<a class="wa" target="_blank" rel="noopener" href="${wa(p.area_phone,`السلام عليكم${p.area_name?" "+p.area_name:""}،\nأتواصل معك ${cm}.`)}">📲 تواصل مع مدير المنطقة</a>`:"";
  const talk=toPM||toCT||toAM?`<div class="acts">${toPM}${toCT}${toAM}</div>`:"";
  const acts=ed?`<div class="acts"><button class="btn" onclick="modal('edit')">تعديل المشروع</button><button class="btn alt" onclick="modal('invc')">إنشاء حساب مقاول</button></div>`:"";
  const items=S.entries.map(e=>`<div class="item"><div>${esc(e.body)}</div>${fileHtml(e)}${e.kind==="issues"?obsBar(e):""}<small>${esc(e.author_role)} · ${new Date(e.created_at).toLocaleDateString("ar")}</small>
  ${own?`<button class="sm del" onclick="delE('${e.id}')">حذف</button>`:""}</div>`).join("");
  const add=t.add.includes(S.role)?`<textarea id="tx" rows="3" placeholder="${t.ph}"></textarea>${t.file?`<input id="fl" type="file" accept="${t.file}" ${t.multi?"multiple":""}>`:""}<button class="btn" id="bt" onclick="addE()">إضافة</button>`:"";
  return `<button class="back" onclick="S.cur=null;render()">← كل المشاريع</button>
  <div class="banner ${ST[p.status][1]}" ${u?`style="background-image:url('${u}')"`:""}>${chip(p)}</div>

  <div class="acts"><button class="btn" onclick="rpDownload()">⬇ تحميل PDF</button>${r.canShare?'<button class="btn alt" onclick="rpShare()">مشاركة</button>':""}<button class="btn alt" onclick="rpPreview()">معاينة</button></div>
  <p class="lbl">على الجوال: «تحميل» يحفظ الملف في الجهاز، و«مشاركة» تفتح قائمة الإرسال (واتساب، حفظ في الملفات…).</p>
  <button class="btn alt" onclick="S.rep.phase='form';render()">تقرير آخر</button> <button class="btn alt" onclick="modal(null)">إغلاق</button></div></div>`;
  const canObs=!!TABS.find(t=>t.k==="issues")?.see.includes(S.role),canPrice=!["contr","site"].includes(S.role);
  const ch=(k,l)=>`<button class="btn alt" style="padding:6px 13px;min-height:0;font-size:13px;border-radius:20px" onclick="rpPreset('${k}')">${l}</button>`;
  const per=r.reno
    ?`<div style="background:#eef3f9;border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-size:13.5px;line-height:1.8">🛠 <b>مشروع ترميم:</b> يصدر التقرير شاملاً لكامل المشروع من بدايته حتى اليوم، بدون تحديد فترات.</div>`
    :`<label class="lbl">الفترة (من – إلى)</label><div class="acts" style="margin:0 0 6px">${ch("7","آخر 7 أيام")}${ch("14","آخر 14 يوم")}${ch("m","هذا الشهر")}${ch("pm","الشهر الماضي")}${ch("all","كامل المشروع")}</div>
  <label class="lbl">من</label><input id="rpf" type="date" value="${esc(r.from)}"><label class="lbl">إلى</label><input id="rpt" type="date" value="${esc(r.to)}">`;
  const sel=(v,t)=>`<option value="${v}" ${String(r.lay)===v?"selected":""}>${t}</option>`;
  return `<div class="modal"><div class="box"><h3>${r.reno?"تقرير ترميم شامل":"إنشاء تقرير إنجاز احترافي"}</h3>
  <p class="lbl">المشروع: <b>${esc(p?.name)}</b> · ${esc(TYN[p?.ptype]||"إنشاء")}</p>
  <label class="lbl">عنوان التقرير</label><input id="rpn" value="${esc(r.title)}">
  ${per}
  <label class="lbl">محتوى التقرير</label>
  ${rpCk("rpu","التحديثات المكتوبة (من تبويب التقارير)",r.upd)}${rpCk("rpp","صور الأعمال",r.pho)}${canObs?rpCk("rpo","المعوقات وحالتها",r.obs):""}${rpCk("rpa","تحليل المشروع والتقرير المكتوب",r.ana)}${canPrice?rpCk("rpr","إظهار قيمة المشروع",r.price):""}
  <label class="lbl">تخطيط الصور</label><select id="rpl">${sel("2","شبكة — صورتان في الصف")}${sel("1","كبيرة — صورة في كل صف")}${sel("3","مصغّرة — 3 صور في الصف")}</select>
  <label class="lbl">التقرير المكتوب (يظهر بعد التحليل، ويمكنك تعديله)</label>
  <textarea id="rpw" rows="8" placeholder="اتركه فارغاً ليُكتب تلقائياً، أو اضغط «كتابة مسودة» ثم عدّل عليها.">${esc(r.text)}</textarea>
  <button class="btn alt" id="rpd" onclick="rpDraftNow()">✨ كتابة مسودة تلقائية</button>
  <p class="lbl">لتنسيق النص: ابدأ السطر بـ «# » لعنوان فرعي أو بـ «- » لنقطة.</p>
  <label class="lbl">أُعدّ بواسطة (يظهر في الغلاف والاعتماد)</label><input id="rpb" value="${esc(r.by)}">
  <label class="lbl">الجودة</label><select id="rpq"><option value="hi" ${r.q==="hi"?"selected":""}>عالية (للعرض والطباعة)</option><option value="md" ${r.q==="md"?"selected":""}>متوسطة (حجم أصغر للمشاركة)</option></select>
  <button class="btn" onclick="rpRun()">إنشاء التقرير</button> <button class="btn alt" onclick="modal(null)">إلغاء</button></div></div>`;
}
function rpReadCfg(){
  const p=S.projects.find(x=>x.id===S.cur),reno=isReno(p);
  return {reno,full:reno,title:$("rpn").value.trim()||(reno?"تقرير الترميم الشامل":"تقرير الإنجاز"),from:reno?"":$("rpf").value,to:reno?"":$("rpt").value,by:$("rpb").value.trim(),
    upd:$("rpu").checked,pho:$("rpp").checked,obs:$("rpo")?.checked??false,ana:$("rpa").checked,text:$("rpw").value.trim(),price:$("rpr")?.checked??false,q:$("rpq").value,lay:$("rpl").value};
}
function rpCheck(cfg){
  if(!cfg.full){if(!cfg.from||!cfg.to)return "حدد تاريخ البداية وتاريخ النهاية";if(cfg.from>cfg.to)return "تاريخ البداية بعد تاريخ النهاية"}
  if(!cfg.upd&&!cfg.pho&&!cfg.obs&&!cfg.ana)return "اختر محتوى واحداً على الأقل";
  return "";
}
async function rpDraftNow(){
  const cfg=rpReadCfg(),er=rpCheck(cfg);if(er)return alert(er);
  const b=$("rpd"),p=S.projects.find(x=>x.id===S.cur);b.disabled=true;b.textContent="جاري تحليل البيانات…";
  try{
    const d=await rpData(p,cfg),G=rpGroups(d,cfg),A=rpAnalyze(p,cfg,d,G);
    if(cfg.text&&!confirm("سيُستبدل النص الحالي بالمسودة. متابعة؟"))return;
    $("rpw").value=rpDraft(p,cfg,d,A,G);
  }catch(e){alert("تعذر كتابة المسودة: "+(e.message||e))}
  finally{b.disabled=false;b.textContent="✨ كتابة مسودة تلقائية"}
}
async function rpRun(){
  const cfg=rpReadCfg(),er=rpCheck(cfg);if(er)return alert(er);
  S.rep={...cfg,phase:"busy"};RP.cancel=false;render();
  try{await rpBuild(cfg)}
  catch(e){S.rep={...cfg,phase:"form"};if(e.message!=="cancel")alert("تعذر إنشاء التقرير: "+(e.message||e));render()}
}
async function rpBuild(cfg){
  const step=(pct,msg)=>{if(RP.cancel)throw new Error("cancel");const b=$("rpbar"),m=$("rpmsg");if(b)b.style.width=pct+"%";if(m)m.textContent=msg};
  const p=S.projects.find(x=>x.id===S.cur);if(!p)throw new Error("لم يتم العثور على المشروع");
  step(3,"تحميل المكتبات…");
  await loadLib("html2canvas.min.js");await loadLib("jspdf.umd.min.js");
  if(document.fonts){await Promise.all(["400","500","600","700","800"].map(w=>document.fonts.load(w+" 16px Tajawal").catch(()=>0)));await document.fonts.ready}
  step(8,"قراءة بيانات المشروع…");
  const data=await rpData(p,cfg);
  if(cfg.full){cfg.from=iso(data.f);cfg.to=iso(data.t)}
  step(14,"تجهيز الصور…");
  await rpImages(p,cfg,data,(i,n)=>step(14+Math.round(i/Math.max(n,1)*32),`تجهيز الصور (${i}/${n})…`));
  step(48,"تحليل البيانات وتنسيق الصفحات…");
  const root=document.createElement("div");root.style.cssText="position:fixed;left:-12000px;top:0;pointer-events:none";document.body.appendChild(root);
  try{
    const pages=rpPages(p,cfg,data,root);
    const doc=await rpPdf(p,cfg,pages,(i,n)=>step(52+Math.round(i/n*46),`إنتاج الصفحة ${i} من ${n}…`));
    step(99,"حفظ الملف…");
    const blob=doc.output("blob"),name=rpName(p,cfg);
    if(RP.url)URL.revokeObjectURL(RP.url);
    RP.blob=blob;RP.url=URL.createObjectURL(blob);
    let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:"application/pdf"})]}))}catch(e){}
    S.rep={...cfg,phase:"done",name,pages:pages.total,size:fmtSize(blob.size),canShare,fail:data.fail};render();
  }finally{root.remove()}
}
const rpName=(p,cfg)=>(cfg.full?`${p.name} - ${cfg.title} ${iso(new Date())}`:`${p.name} - ${cfg.title} ${cfg.from} إلى ${cfg.to}`).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim()+".pdf";
function rpDownload(){const a=document.createElement("a");a.href=RP.url;a.download=S.rep.name;document.body.appendChild(a);a.click();a.remove()}
async function rpShare(){try{await navigator.share({files:[new File([RP.blob],S.rep.name,{type:"application/pdf"})],title:S.rep.name})}catch(e){if(e.name!=="AbortError")alert("تعذرت المشاركة: "+(e.message||e))}}
function rpPreview(){window.open(RP.url,"_blank")}

/* —— البيانات —— */
async function rpData(p,cfg){
  const eod=new Date();eod.setHours(23,59,59,999);
  const f=cfg.full?new Date(0):new Date(cfg.from+"T00:00:00"),t=cfg.full?eod:new Date(cfg.to+"T23:59:59.999"),rows=[];
  for(let o=0;;o+=1000){
    const {data,error}=await sb.from("entries").select("*").eq("project_id",p.id).in("kind",["reports","media","issues"]).order("created_at",{ascending:true}).range(o,o+999);
    if(error)throw error;rows.push(...data);if(data.length<1000)break;
  }
  const d=rpClassify(rows,f,t);
  if(cfg.full){const ds=rows.map(e=>new Date(e.created_at));if(p.start_date)ds.push(new Date(p.start_date+"T00:00:00"));d.f=day0(ds.length?new Date(Math.min(...ds)):new Date())}
  return d;
}
function rpClassify(rows,f,t){
  const inP=e=>{const d=new Date(e.created_at);return d>=f&&d<=t},isImg=e=>e.file_path&&(e.file_type||"").startsWith("image");
  const issAll=rows.filter(e=>e.kind==="issues");
  return {f,t,
    ups:rows.filter(e=>e.kind==="reports"&&inP(e)&&cleanTxt(e.body)),
    atts:rows.filter(e=>e.kind==="reports"&&inP(e)&&e.file_path&&!isImg(e)).length,
    pics:rows.filter(e=>(e.kind==="media"||e.kind==="reports")&&isImg(e)&&inP(e)),
    iss:issAll.filter(inP),issAll,issOld:issAll.filter(e=>new Date(e.created_at)<f&&e.resolved===false),
    lastAny:rows.length?new Date(Math.max(...rows.map(e=>+new Date(e.created_at)))):null,
    img:{},fail:0,cover:""};
}
async function rpPrep(url,mode,L){
  const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);
  const u=URL.createObjectURL(await r.blob());
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=u});
    const cv=mode==="cover",W=cv?1428:L.W,H=cv?1000:L.H,c=document.createElement("canvas");c.width=W;c.height=H;
    const x=c.getContext("2d");x.fillStyle="#eef1f5";x.fillRect(0,0,W,H);
    const s=cv?Math.max(W/img.naturalWidth,H/img.naturalHeight):Math.min(W/img.naturalWidth,H/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    const out=c.toDataURL("image/jpeg",.84);c.width=c.height=0;return out;
  }finally{URL.revokeObjectURL(u)}
}
async function rpImages(p,cfg,data,prog){
  const L=LAY[cfg.lay]||LAY[2];
  const want=[...new Set([...(cfg.pho?data.pics.map(e=>e.file_path):[]),p.cover_path].filter(Boolean))],urls={};
  for(let i=0;i<want.length;i+=100){
    const {data:d}=await sb.storage.from("media").createSignedUrls(want.slice(i,i+100),3600);
    (d||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl});
  }
  const jobs=want.filter(x=>urls[x]),q=[...jobs];let done=0,fail=want.length-jobs.length;
  await Promise.all(Array.from({length:3},async()=>{
    while(q.length){const path=q.shift();
      try{data.img[path]=await rpPrep(urls[path],path===p.cover_path?"cover":"fit",L)}catch(e){fail++}
      prog(++done,jobs.length)}
  }));
  data.cover=data.img[p.cover_path]||"";
  data.pics=data.pics.filter(e=>data.img[e.file_path]);
  data.fail=fail;
}

/* —— التحليل —— */
function rpGroups(d,cfg){
  const f=day0(d.f),t=day0(d.t),days=Math.round((t-f)/864e5)+1,mode=cfg.full?"month":days<=10?"day":"week";
  const keyOf=dt=>{const x=day0(dt);if(mode==="day")return iso(x);if(mode==="month")return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");x.setDate(x.getDate()-x.getDay());return iso(x)};
  const all=[],map=new Map();
  let cur=mode==="day"?new Date(f):mode==="month"?new Date(f.getFullYear(),f.getMonth(),1):addDays(f,-f.getDay());
  while(cur<=t){
    const s=new Date(cur),e=mode==="day"?new Date(cur):mode==="month"?new Date(cur.getFullYear(),cur.getMonth()+1,0):addDays(cur,6);
    const b={k:keyOf(s),s,e,ups:[],pics:[]};all.push(b);map.set(b.k,b);
    cur=mode==="day"?addDays(cur,1):mode==="month"?new Date(cur.getFullYear(),cur.getMonth()+1,1):addDays(cur,7);
  }
  if(cfg.upd)d.ups.forEach(e=>{const b=map.get(keyOf(e.created_at));if(b)b.ups.push(e)});
  if(cfg.pho)d.pics.forEach(e=>{const b=map.get(keyOf(e.created_at));if(b)b.pics.push(e)});
  all.forEach((b,i)=>{
    if(mode==="day"){b.tag="يوم العمل";b.label=dfmt(b.s,RPNF);b.short=dfmt(b.s,{day:"numeric",month:"numeric"})}
    else if(mode==="month"){b.tag="الشهر";b.label=dfmt(b.s,{month:"long",year:"numeric"});b.short=dfmt(b.s,{month:"short"})}
    else{b.tag="الأسبوع "+String(i+1).padStart(2,"0");const a=b.s<f?f:b.s,z=b.e>t?t:b.e;b.label=`من ${dfmt(a)} إلى ${dfmt(z)}`;b.short="أ"+(i+1)}
  });
  return {all,list:all.filter(b=>b.ups.length||b.pics.length),days,mode};
}
function rpAnalyze(p,cfg,d,G){
  const T=day0(new Date()),isDone=p.status==="done",A={prog:clamp(p.progress),done:isDone,days:G.days};
  const S0=p.start_date?new Date(p.start_date+"T00:00:00"):null,E0=p.due?new Date(p.due+"T00:00:00"):null;
  if(S0&&E0&&E0>S0){
    A.total=Math.round((E0-S0)/864e5);A.el=Math.max(0,Math.round((T-S0)/864e5));A.elp=Math.max(0,Math.min(100,Math.round(A.el/A.total*100)));
    A.left=Math.round((E0-T)/864e5);A.diff=A.prog-A.elp;A.spi=A.elp>0?A.prog/A.elp:null;
    if(!isDone){A.rem=100-A.prog;if(A.left>0)A.reqW=A.rem/(A.left/7);if(A.el>0&&A.prog>0)A.curW=A.prog/(A.el/7)}
  }
  if(S0&&!isDone&&A.prog>=5&&T>S0){const el=Math.round((T-S0)/864e5);if(el>=7){A.est=addDays(S0,Math.round(el/(A.prog/100)));if(E0)A.delta=Math.round((A.est-E0)/864e5)}}
  const act=[...(cfg.upd?d.ups:[]),...(cfg.pho?d.pics:[])];
  A.act=act.length;
  A.idle=d.lastAny?Math.max(0,Math.round((T-day0(d.lastAny))/864e5)):null;
  const I=d.issAll||[],io=A.io={tot:I.length,open:0,res:I.filter(e=>e.resolved===true).length,known:I.some(e=>e.resolved!==undefined)};
  io.list=I.filter(e=>e.resolved===false).map(e=>({e,age:Math.max(0,Math.round((T-day0(e.created_at))/864e5))})).sort((a,b)=>b.age-a.age);
  io.open=io.list.length;io.oldest=io.open?io.list[0].age:null;
  const rt=I.filter(e=>e.resolved===true&&e.resolved_at).map(e=>(new Date(e.resolved_at)-new Date(e.created_at))/864e5);
  io.avg=rt.length?rt.reduce((x,y)=>x+y,0)/rt.length:null;io.rate=io.tot&&io.known?Math.round(io.res/io.tot*100):null;
  const rl=e=>ROLES[e.author_role]||e.author_role||"";
  /* بنود تحتاج قراراً/متابعة (مرتبة بالأهمية) */
  const att=[];let hs=false;
  if(!isDone){
    if(A.left!==undefined&&A.left<0){att.push({l:"h",t:`تجاوز موعد التسليم بـ ${-A.left} يوماً`,s:`المتبقي من الأعمال ${100-A.prog}%`});hs=true}
    else if(A.delta>0){att.push({l:A.delta>14?"h":"m",t:`التسليم المتوقع متأخر نحو ${A.delta} يوماً عن الموعد`,s:A.reqW&&A.curW?`المعدل الحالي ${A.curW.toFixed(1)}% أسبوعياً والمطلوب ${A.reqW.toFixed(1)}%`:""});if(A.delta>14)hs=true}
    else if(A.diff!==undefined&&A.diff<-5){att.push({l:A.diff<=-15?"h":"m",t:`الإنجاز أقل من المخطط بمقدار ${-A.diff} نقطة مئوية`,s:`الفعلي ${A.prog}% مقابل المخطط ${A.elp}%`});if(A.diff<=-15)hs=true}
    if(A.idle!==null&&A.idle>7)att.push({l:A.idle>14?"h":"m",t:`لا يوجد توثيق منذ ${A.idle} يوماً`,s:"آخر تحديث أو صورة مسجلة في المشروع"});
  }
  if(cfg.obs!==false)io.list.slice(0,5).forEach(o=>att.push({l:o.age>14?"h":"m",t:cut(cleanTxt(o.e.body).replace(/\n/g," "),120),s:`مفتوح منذ ${o.age} يوماً${rl(o.e)?` · رفعه: ${rl(o.e)}`:""}`}));
  if(cfg.obs!==false&&io.open>5)att.push({l:"l",t:`و${io.open-5} معوقات أخرى مفتوحة`,s:"التفاصيل في سجل المعوقات"});
  A.attn=att;
  const H=att.filter(x=>x.l==="h").length,lv=hs||H>=2?"r":att.some(x=>x.l==="h"||x.l==="m")?"a":"g";
  A.rag=isDone?"g":lv;
  A.ragT=[isDone?"تم تسليم المشروع":lv==="g"?"الوضع العام: جيد":lv==="a"?"الوضع العام: يحتاج متابعة":"الوضع العام: حرج"];
  /* خلاصة بجملة واحدة */
  const parts=[];
  if(isDone)parts.push("اكتملت أعمال المشروع وتم تسليمه");
  else if(A.left!==undefined&&A.left<0)parts.push(`تجاوز المشروع موعد التسليم بـ ${-A.left} يوماً وبقي ${100-A.prog}% من الأعمال`);
  else if(A.delta!==undefined)parts.push(A.delta>7?`المشروع متأخر عن الخطة، وبالوتيرة الحالية يُتوقع التسليم بعد الموعد بنحو ${A.delta} يوماً`:A.delta<-7?`المشروع متقدم على الخطة، ويُتوقع التسليم قبل الموعد بنحو ${-A.delta} يوماً`:"المشروع يسير وفق الخطة، والتسليم المتوقع قريب من الموعد");
  else if(A.diff!==undefined)parts.push(`الإنجاز الفعلي ${A.prog}% ${A.diff>=0?"أعلى من":"أقل من"} المخطط حتى اليوم (${A.elp}%)`);
  else parts.push(`نسبة الإنجاز ${A.prog}%، ولم تُحدَّد تواريخ المشروع لقياس الالتزام بالجدول`);
  if(io.open)parts.push(`${io.open} معوق مفتوح${io.oldest>14?` (أقدمها منذ ${io.oldest} يوماً)`:""}`);
  A.verdict=parts.join("، ")+".";
  /* إجراءات مقترحة */
  const ac=[];
  io.list.filter(o=>o.age>14).slice(0,3).forEach(o=>ac.push(`تصعيد المعوق «${cut(cleanTxt(o.e.body).replace(/\n/g," "),70)}» (مفتوح منذ ${o.age} يوماً): تحديد مسؤول وموعد حل ملزم.`));
  if(io.open&&!ac.length)ac.push(`متابعة المعوقات المفتوحة (${io.open}) أسبوعياً حتى إغلاقها.`);

    const lst=(title,arr)=>arr.forEach((e,i)=>{put(i?oc(e):`<div>${ot}<div class="st">${title} (${arr.length})</div>${oc(e)}</div>`);if(!i&&op){mark();op=false}ot=""});
    if(d.iss.length)lst(reno?"جميع المعوقات المسجلة":"معوقات سُجّلت خلال الفترة",d.iss);
    if(d.issOld.length)lst("معوقات مفتوحة من فترات سابقة",d.issOld);
  }
  /* الاعتماد */
  const pBox=box,pEl=box.lastElementChild;
  const sgEl=put(`<div class="sg"><div><b>أعدّه</b>${by||"&nbsp;"}<div class="ln">التوقيع / التاريخ</div></div><div><b>راجعه</b>&nbsp;<div class="ln">التوقيع / التاريخ</div></div><div><b>اعتمده</b>&nbsp;<div class="ln">التوقيع / التاريخ</div></div></div>`);
  if(box!==pBox&&pEl&&pEl.parentNode===pBox){pBox.removeChild(pEl);box.insertBefore(pEl,sgEl)}
  /* الفهرس */
  tocEl.innerHTML=marks.filter(m=>m[2]).map(m=>`<span><b>${m[0]}.</b> ${m[1].split(" ").map(w=>`<b><u>${w}</u></b>`).join("")}<em>ص ${m[2]}</em></span>`).join("");
  pages.total=pages.length;return pages;
}
async function rpPdf(p,cfg,pages,prog){
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"p",unit:"pt",format:"a4",compress:true}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const sc=cfg.q==="hi"?2:1.4,ql=cfg.q==="hi"?.9:.8,N=pages.length;
  pages.forEach((pg,i)=>{const n=pg.querySelector(".pnum");if(n)n.textContent=`صفحة ${i+1} من ${N}`});
  for(let i=0;i<N;i++){
    if(RP.cancel)throw new Error("cancel");
    prog(i+1,N);
    const cv=await html2canvas(pages[i],{scale:sc,backgroundColor:"#ffffff",logging:false,useCORS:true});
    if(i)doc.addPage();
    doc.addImage(cv.toDataURL("image/jpeg",ql),"JPEG",0,0,W,H,undefined,"FAST");
    cv.width=cv.height=0;pages[i].remove();
    await new Promise(r=>setTimeout(r,0));
  }
  doc.setProperties({title:`${p.name} - ${cfg.title}`,subject:cfg.full?"تقرير شامل":`${cfg.from} → ${cfg.to}`,author:cfg.by||"إدارة المشاريع",creator:"إدارة المشاريع",keywords:rpRef(p)});
  return doc;
}
async function saveProj(){
  const name=$("mn").value.trim();if(!name)return alert("اكتب اسم المشروع");
  const s=$("mb").value,d=$("md").value;
  if(s&&d&&d<s)return alert("تاريخ التسليم قبل تاريخ البداية");
  const pp=normP($("mpp").value),cp=normP($("mcp").value),ap=normP($("map").value);
  if(($("mpp").value.trim()&&!pp)||($("mcp").value.trim()&&!cp)||($("map").value.trim()&&!ap))return alert("رقم الجوال غير صحيح، اكتبه مع رمز الدولة بدون + أو أصفار، مثال: 9655XXXXXXX");
  const row={name,loc:$("ml").value.trim(),contractor_name:$("mct").value.trim()||null,site_manager:$("msm").value.trim()||null,pm_name:$("mpn").value.trim()||null,pm_phone:pp||null,contractor_phone:cp||null,area_name:$("mam").value.trim()||null,area_phone:ap||null,ptype:$("mty").value,status:$("ms").value,progress:clamp($("mp").value),start_date:s||null,due:d||null,price:$("mpr").value===""?null:Number($("mpr").value)};
  $("mbtn").disabled=true;$("mbtn").textContent="جاري الحفظ...";
  const q=S.modal==="edit"?sb.from("projects").update(row).eq("id",S.cur):sb.from("projects").insert(row);
  const {data,error}=await q.select().single();
  if(error){alert(error.message);return modal(null)}
  const f=$("mc").files[0];
  if(f){const path=await up(data.id,f);if(path)await sb.from("projects").update({cover_path:path}).eq("id",data.id)}
  S.modal=null;await load();
}
async function delProj(){
  if(!confirm("حذف المشروع وكل ما فيه؟"))return;
  const {data:es}=await sb.from("entries").select("file_path").eq("project_id",S.cur);
  const paths=(es||[]).map(e=>e.file_path).filter(Boolean);
  const cp=S.projects.find(x=>x.id===S.cur)?.cover_path;if(cp)paths.push(cp);
  if(paths.length)await sb.storage.from("media").remove(paths);
  const {error}=await sb.from("projects").delete().eq("id",S.cur);
  if(error)return alert(error.message);
  S.cur=null;S.modal=null;await load();
}
async function addE(){
  const body=$("tx").value.trim(),fs=[...($("fl")?.files||[])];
  if(!body&&!fs.length)return;
  $("bt").disabled=true;
  const base={project_id:S.cur,kind:S.tab,author_role:ROLES[S.role]},rows=[];
  if(!fs.length)rows.push({...base,body,file_path:null,file_type:null});
  for(let i=0;i<fs.length;i++){
    $("bt").textContent=`جاري رفع ${i+1} من ${fs.length}...`;
    const path=await up(S.cur,fs[i]);
    if(path)rows.push({...base,body,file_path:path,file_type:fs[i].type});
  }
  if(!rows.length)return render();
  const {error}=await sb.from("entries").insert(rows);
  if(error)alert(error.message);
  await loadE();render();
}
async function delE(id){
  if(!confirm("حذف؟"))return;
  const e=S.entries.find(x=>x.id===id);
  if(e?.file_path)await sb.storage.from("media").remove([e.file_path]);
  await sb.from("entries").delete().eq("id",id);await loadE();render();
}

  <button class="btn" onclick="copyCred(this)">نسخ البيانات</button> <button class="btn alt" onclick="modal(null)">إغلاق</button></div></div>`;
  const K={invc:["contr","إنشاء حساب مقاول للمشروع: "+(p?.name||""),"المقاول يرى هذا المشروع فقط: يرفع التقارير والمعوقات والصور ويناقشك، ولا يرى ملاحظات الإدارة."],

    invp:["pm","إنشاء حساب مدير مشروع","مدير المشروع ينشئ مشاريعه ويديرها بصلاحياتك ويدعو مقاوليه، ولا يرى مشاريع غيره، ولا يحذف الملاحظات أو المناقشات أو التقارير."]};

const rndPass=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");
async function mkAccount(role){
  const user=$("au").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),pass=$("ap").value;
  if(user.length<3)return alert("اسم المستخدم 3 أحرف أو أرقام إنجليزية على الأقل");
  if(pass.length<6)return alert("كلمة المرور 6 أحرف على الأقل");
  $("ab").disabled=true;$("ab").textContent="جاري الإنشاء...";
  const fail=m=>{alert(m);$("ab").disabled=false;$("ab").textContent="إنشاء الحساب"};
  const {data,error}=await sb2.auth.signUp({email:user+"@"+UD,password:pass});
  if(error)return fail(/already|registered/i.test(error.message)?"اسم المستخدم مستخدم، اختر غيره":error.message);
  const {error:e2}=role==="site"?await sb.rpc("create_site",{uid:data.user.id,nm:($("an")?.value.trim())||user,un:user}):await sb.rpc("create_member",{uid:data.user.id,new_role:role,pid:role==="contr"?S.cur:null});
  sb2.auth.signOut().catch(()=>{});
  if(e2)return fail(e2.message);
  S.cred=`الموقع: ${location.origin+location.pathname}\nاسم المستخدم: ${user}\nكلمة المرور: ${pass}`;render();
}
