<head>

<style>
:root{--navy:#0f2742;--bg:#f4f6fa;--card:#fff;--text:#1b2a3b;--muted:#64748b;--line:#e2e8f0;--run:#2563eb;--late:#dc2626;--plan:#d97706;--done:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--text)}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;margin:4px 0 10px;background:#fff}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.wrap{max-width:1200px;margin:auto;padding:20px}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:19px}.hb{display:flex;gap:8px;align-items:center}.rl{font-size:13px;opacity:.85}
.sm{background:#ffffff26;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer}
.sm.del{background:#fee2e2;color:var(--late);margin-top:6px}
.btn{background:var(--run);color:#fff;border:0;padding:11px 22px;border-radius:10px;cursor:pointer;font-weight:700;margin:4px 0}
.btn:disabled{opacity:.6;cursor:wait}.btn.alt{background:#475569}.btn.danger{background:var(--late)}
.back{background:none;border:0;color:var(--run);font-weight:700;cursor:pointer;padding:0 0 12px}
.s-run{--c:var(--run)}.s-plan{--c:var(--plan)}.s-done{--c:var(--done)}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}.top h2{margin:0;font-size:22px}
/* الأعمدة الثلاثة */
.cols{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.dashStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 18px}.dashStat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:0 3px 12px #0f274208}.dashStat span{display:block;color:var(--muted);font-size:13px}.dashStat b{display:block;font-size:24px;color:var(--navy)}.dashTools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 14px}.dashTools h2{margin:0}.dashSearch{max-width:360px;margin:0;background:#fff}@media(max-width:680px){.dashStats{grid-template-columns:repeat(2,1fr)}.dashTools{align-items:stretch;flex-direction:column}.dashSearch{max-width:none}}
.col{background:#e9eef5;border-radius:18px;padding:12px;border-top:6px solid var(--c)}
.col h3{margin:4px 4px 12px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.col h3 b{background:var(--c);color:#fff;border-radius:20px;padding:0 12px;font-size:15px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #0f274214;cursor:pointer;margin-bottom:12px}
.img{height:170px;background:linear-gradient(135deg,#cbd5e1,#94a3b8) center/cover;position:relative}
.cw{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}

.chip.ty{background:#334155}
.wa{background:#25d366;color:#fff;border-radius:10px;padding:11px 18px;text-decoration:none;font-weight:700;font-size:15px}
.chip.ok{background:var(--done)}.chip.late{background:var(--late)}
.body{padding:14px}.body h4{margin:0 0 2px;font-size:19px}.body p{margin:0;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;margin:12px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
/* صفحة المشروع */
.banner{height:280px;border-radius:18px;background:linear-gradient(135deg,#cbd5e1,#94a3b8) center/cover;position:relative}
.box{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 14px #0f274210}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:14px 0}
.det span{display:block;font-size:13px;color:var(--muted)}.det b{font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:24px;cursor:pointer;font-weight:500}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lbl{font-size:13px;color:var(--muted)}
.item{border-bottom:1px solid var(--line);padding:12px 0}.item small{color:var(--muted);display:block;margin-top:6px}
.item img,.item video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:8px}

.lb{position:fixed;inset:0;background:#000d;z-index:99;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}

.login{max-width:380px;margin:50px auto}.msg{color:var(--late);font-size:14px;min-height:20px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto}
.link{white-space:pre-wrap;background:#eff6ff;padding:10px;border-radius:10px;word-break:break-all;font-size:13px;direction:ltr;text-align:left}

/* الصيانة */
.mbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}.mbar select{width:auto;margin:0;min-width:130px}.mbar .btn{margin:0 auto 0 0}.mtg{font-size:14px;display:flex;gap:6px;align-items:center}.mtg input{width:auto;margin:0}
.mc{border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0f274211;cursor:pointer;border-right:6px solid #cbd5e1;transition:.15s;background:#fff}.mc:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0f27421a}.mc .mt1{font-size:15px;font-weight:700;margin:6px 0;line-height:1.4}
.mboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(255px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.mcol{background:#e9eef5;border-radius:16px;padding:10px;border-top:5px solid var(--c);min-height:120px}.mcol h3{margin:2px 4px 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}.mcol h3 b{background:var(--c);color:#fff;border-radius:20px;padding:0 10px;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mc{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:0 2px 8px #0f274214;cursor:pointer;border-right:5px solid #cbd5e1}.mc:active{transform:scale(.99)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mh b{font-size:13px;color:var(--muted)}.mchip{color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.mt1{font-weight:700;margin:5px 0;line-height:1.5}.mm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}.mf{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.mpend{margin-top:7px;background:#ede9fe;color:#6d28d9;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:700}
.msteps{display:flex;gap:4px;margin:6px 0 12px}.msteps>div{flex:1;text-align:center;font-size:11.5px;color:#94a3b8;border-top:4px solid #e2e8f0;padding-top:6px}.msteps i{display:block;width:24px;height:24px;line-height:24px;margin:0 auto 2px;border-radius:50%;background:#e2e8f0;font-style:normal;font-weight:700;color:#64748b}
.msteps .dn{border-color:#16a34a;color:#16a34a}.msteps .dn i{background:#16a34a;color:#fff}.msteps .cur{border-color:var(--c);color:var(--c);font-weight:700}.msteps .cur i{background:var(--c);color:#fff}
.mpanel{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.mres{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mck{display:flex;gap:8px;align-items:center;margin:6px 0}.mck input{width:auto;margin:0}
.mqh,.mqr{display:grid;grid-template-columns:1fr 70px 90px 90px 32px;gap:6px;align-items:center}.mqh{font-size:12px;color:var(--muted);margin-bottom:2px}.mqh b{grid-column:4/6;font-weight:500}.mqr input{margin:0;padding:8px}.mqr.ro{grid-template-columns:1fr 70px 90px 90px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}.mqh{grid-template-columns:1fr 70px 90px 122px}
.mtot{margin-top:10px;display:grid;gap:4px;max-width:320px;margin-right:auto}.mtot div{display:flex;justify-content:space-between;font-size:14px}.mtot .g{font-size:17px;font-weight:800;border-top:2px solid var(--navy);padding-top:5px}
.mqs{display:inline-block;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700;margin-bottom:8px;background:#e2e8f0}.mqs.pending{background:#ede9fe;color:#6d28d9}.mqs.approved{background:#dcfce7;color:#166534}.mqs.returned,.mqs.rejected{background:#fee2e2;color:#b91c1c}
.hlq{background:#fffbeb;border-right:4px solid #f59e0b;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.mout{border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:8px;background:#e2e8f0}.mout.done{background:#dcfce7;color:#166534}.mout.rejected{background:#fee2e2;color:#b91c1c}
.mtl{max-height:300px;overflow:auto}.mev{border-right:3px solid #cbd5e1;padding:4px 10px;margin:6px 0;font-size:14px}.mev.stage{border-color:#2563eb}.mev.quote{border-color:#7c3aed}.mev small{display:block;color:var(--muted);font-size:12px}
.sst{display:flex;gap:4px;margin:12px 0}.sst>div{flex:1;text-align:center;font-size:12px;color:var(--muted)}.sst i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:#e3e9ef;color:#647589;font-style:normal;font-weight:700}.sst .dn i{background:#16a34a;color:#fff}.sst .cur{font-weight:700;color:var(--text,#182b3d)}.sst .cur i{background:#ed8700;color:#fff;box-shadow:0 0 0 4px #ed870033}.sinfo{background:#eff6ff;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e3e9ef;border-radius:12px;padding:12px;margin:8px 0;background:#fff;cursor:pointer;text-align:right;width:100%;font:inherit;color:inherit}
.mgal{margin:12px 0 0}.mgp{margin:8px 0}.mgp>b{display:block;font-size:13px;color:var(--muted)}.mdt{margin-top:14px}.mdt summary{cursor:pointer;font-weight:700;padding:6px 0}.mtl2{margin:6px 0 0;padding-right:14px;border-right:2px solid #e3e9ef}.mtv{position:relative;padding:0 12px 12px 0;font-size:14px}.mtv i{position:absolute;right:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:#2e69ad;border:2px solid #fff}.mtv small{display:block;color:var(--muted);font-size:12px}
.mth{width:120px!important;height:90px!important;max-height:none!important;object-fit:cover;border-radius:8px;margin:6px 6px 0 0!important;display:inline-block}
@media(max-width:600px){.mqh,.mqr{grid-template-columns:1fr 54px 74px 74px 28px}.mqr.ro{grid-template-columns:1fr 54px 74px 74px}.mqh{grid-template-columns:1fr 54px 74px 102px}}
/* الصيانة v2 */
.mtoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#102944;color:#fff;padding:11px 22px;border-radius:30px;z-index:200;font-weight:700;box-shadow:0 8px 24px #0004}
.modal .box.mtk{max-width:560px}
.mstt{display:inline-block;background:var(--c);color:#fff;border-radius:20px;padding:3px 16px;font-weight:800;font-size:15px;margin:0 0 10px}
.mstage{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:6px 0}
.mwait{background:#fffbeb;border:1px dashed #f59e0b;color:#92400e;border-radius:10px;padding:12px;text-align:center;font-weight:700;margin-top:10px}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:10px}
.mbtns{display:grid;gap:8px;margin-top:10px}.mbtns .btn{width:100%;margin:0;padding:13px}
.mpre{white-space:pre-wrap}
.mrep{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.mrep>b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.mcostbox{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}.mcostbox span{color:var(--muted)}.mcostbox b{font-size:24px;color:var(--navy)}
.mcin{font-size:22px!important;font-weight:800;text-align:center}
.mdur{display:flex;gap:8px}.mdur input{flex:1}.mdur select{width:110px}
.mfile{padding:12px;border:2px dashed #cbd5e1;background:#fff}
.mpics{margin:4px 0 8px}
.mtb{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.mtb td{padding:6px 4px;border-bottom:1px solid var(--line)}.mtb td:first-child{color:var(--muted);width:32%}
.tfs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.tfs button{border:1px solid var(--line);background:#fff;border-radius:22px;padding:7px 16px;cursor:pointer;font-weight:600}.tfs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dashStats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))!important}
.img.mimg{display:grid;place-items:center;background:linear-gradient(135deg,#183b5c,#0f2742);height:120px}.mimg .mic{font-size:44px;opacity:.85}
.card.mine{outline:3px solid #ed8700}
</style>

<body>
<div id="app"><div class="note">جاري التحميل...</div></div>
<script>
/* ===== 1) الإعدادات ===== */
const SBU="https://wmavitpimbcjohcjgqhz.supabase.co",SBK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtYXZpdHBpbWJjam9oY2pncWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODg4MDQsImV4cCI6MjEwNjk2NDgwNH0.sR6dTymzM2TgclddArsdMfuxEZ3rTADB2Ti796X8d5Y";
const sb=supabase.createClient(SBU,SBK);
const sb2=supabase.createClient(SBU,SBK,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});   // لإنشاء حسابات الآخرين
const UD="asemshawi-blip.github.io";   // نطاق داخلي لاسم المستخدم
const ROLES={owner:"مدير المشروع",pm:"مدير مشروع",mgmt:"الإدارة",contr:"المقاول",site:"مدير الموقع"};
const ST={plan:["التصميم","s-plan"],run:["قيد التنفيذ","s-run"],done:["تم التسليم","s-done"]};
/* see = من يشاهد ، add = من يضيف (المالك فقط يحذف) */
const TABS=[
{k:"works",n:"متابعة الأعمال",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site"},
{k:"notes",n:"ملاحظات الإدارة",see:"owner,pm,mgmt",add:"owner,pm,mgmt",ph:"اكتب ملاحظة..."},
{k:"coord",n:"التنسيق",see:"owner,pm,site",add:"owner,pm,site",ph:"اكتب ملاحظة أو خطوات التنسيق مع المالك..."},
{k:"issues",n:"المعوقات والملاحظات",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site",ph:"اكتب المعوق أو الملاحظة..."},
{k:"reports",n:"التقارير",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site",ph:"عنوان التقرير وملخصه...",file:"*/*"},
{k:"media",n:"الصور",see:"owner,pm,mgmt,contr,site",add:"owner,pm,contr,site",ph:"وصف (اختياري)",file:"image/*",multi:1}];
let S={works:[],user:null,role:"none",projects:[],cur:null,tab:"notes",entries:[],urls:{},modal:null,link:"",wl:{obs:[],notes:[]},sites:[],ps:[],q:""};

/* ===== 2) مساعدات ===== */
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(100,parseInt(v)||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stOpts=v=>Object.keys(ST).map(k=>`<option value="${k}" ${k===v?"selected":""}>${ST[k][0]}</option>`).join("");
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const daysBetween=(a,b)=>a&&b?Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5):"";
const inv=()=>new URLSearchParams(location.search).get("invite");
const money=v=>v==null||v===""?"-":Number(v).toLocaleString("en-US");
/* متأخر / على الموعد + عداد الأيام (لا يظهر بعد التسليم) */
function timing(p){
  if(p.status==="done"||!p.due)return null;
  const d=Math.round((new Date(p.due+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
  return d<0?{late:1,t:`متأخر ${-d} يوم`}:{late:0,t:d===0?"على الموعد · التسليم اليوم":`على الموعد · باقي ${d} يوم`};
}
const TYN={new:"إنشاء",reno:"ترميم"},TYE={new:"🏗",reno:"🛠"};
const chip=p=>{const t=timing(p),y=TYN[p.ptype]?TYE[p.ptype]+" "+TYN[p.ptype]:"";return t||y?`<div class="cw">${t?`<span class="chip ${t.late?"late":"ok"}">${t.t}</span>`:""}${y?`<span class="chip ty">${y}</span>`:""}</div>`:""};
const normP=v=>{const d=String(v).replace(/\D/g,"").replace(/^00/,"");return d.length>=10&&!d.startsWith("0")?d:""};
const wa=(ph,m)=>"https://wa.me/"+ph+"?text="+encodeURIComponent(m);

/* ===== 3) الدخول ===== */
async function init(){
  const kk=new URLSearchParams(location.search).get("k");if(kk)return mgLink(kk);   /* رابط الإدارة: بدون تسجيل دخول */
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null;
  S.user?boot():loginView();
}
function loginView(msg=""){
  $("app").innerHTML=`<div class="login box"><h2>${inv()?"قبول الدعوة":"تسجيل الدخول"}</h2>
  <input id="em" type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" autocomplete="username" autocapitalize="none" dir="ltr">
  <input id="pw" type="password" placeholder="كلمة المرور (6 أحرف فأكثر)" onkeydown="if(event.key==='Enter')signIn()">
  <div class="msg">${msg}</div><button class="btn" onclick="signIn()">دخول</button>
  ${inv()?'<button class="btn alt" onclick="signUp()">إنشاء حساب جديد</button>':""}</div>`;
}
async function signIn(){
  let em=$("em").value.trim();if(!em.includes("@"))em=em.toLowerCase()+"@"+UD;
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:$("pw").value});
  if(error)return loginView("البريد أو كلمة المرور غير صحيحة");
  S.user=data.user;boot();
}
async function signUp(){
  const {data,error}=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
  if(error)return loginView(esc(error.message));
  if(!data.session)return loginView("تم إنشاء الحساب. أكّد بريدك ثم افتح رابط الدعوة مرة ثانية وسجّل دخول.");
  S.user=data.user;boot();
}

async function sign(paths){
  const need=[...new Set(paths.filter(x=>x&&!S.urls[x]))];
  if(!need.length)return;
  const {data}=await sb.storage.from("media").createSignedUrls(need,7200);
  (data||[]).forEach(d=>{if(d.signedUrl)S.urls[d.path]=d.signedUrl});
}
async function shrink(f){
  if(!f.type||!f.type.startsWith("image/")||/gif|svg/.test(f.type)||f.size<120*1024)return f;
  /* يجرب 3 مستويات ويقف عند أول ناتج ≤ 180 كيلوبايت */
  const LV=[[1280,.72],[1100,.62],[960,.52]],TARGET=180*1024;
  const out=(c,q)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));
  const enc=async(src,w,h)=>{let best=null;
    for(const [M,q] of LV){const k=Math.min(1,M/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
      const b=await out(c,q);c.width=c.height=0;if(b&&(!best||b.size<best.size))best=b;if(b&&b.size<=TARGET)break}
    return best};
  let b=null;
  try{const bmp=await createImageBitmap(f,{imageOrientation:"from-image"});try{b=await enc(bmp,bmp.width,bmp.height)}finally{if(bmp.close)bmp.close()}}catch(e){}
  if(!b){const u=URL.createObjectURL(f);try{const im=new Image();im.src=u;await im.decode();b=await enc(im,im.naturalWidth,im.naturalHeight)}catch(e){}finally{URL.revokeObjectURL(u)}}
  return b&&b.size<f.size?new File([b],"photo.jpg",{type:"image/jpeg"}):f;
}
const isNetErr=e=>/fetch|network|load failed|timeout|abort|offline/i.test(String((e&&e.message)||e));
async function up(pid,f,quiet){
  f=await shrink(f);
  const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
  const path=`${pid}/${crypto.randomUUID()}.${ext}`;
  let error;try{({error}=await sb.storage.from("media").upload(path,f,{contentType:f.type||"application/octet-stream"}))}catch(e){error=e}
  if(error){if(quiet&&(!navigator.onLine||isNetErr(error)))return "NET";alert("فشل الرفع: "+error.message);return null}
  return path;
}

  document.querySelectorAll(".col").forEach(col=>{let count=0;col.querySelectorAll(".card[data-search]").forEach(c=>{const show=c.dataset.search.includes(S.q);c.style.display=show?"":"none";if(show)count++});const empty=col.querySelector(".empty");if(empty){empty.style.display=count?"none":"block";empty.textContent=S.q?"لا توجد نتائج مطابقة":"لا توجد مشاريع"}});
}

function fileHtml(e){
  const u=S.urls[e.file_path];if(!u)return"";
  const t=e.file_type||"";
  if(t.startsWith("image"))return `<img src="${u}" loading="lazy" onclick="openImg(this.src)">`;
  if(t.startsWith("video"))return `<video src="${u}" controls preload="none"></video>`;
  return `<p><a href="${u}" target="_blank" rel="noopener">📎 فتح الملف</a></p>`;
}

function rpPreset(k){
  const t=day0(new Date()),p=S.projects.find(x=>x.id===S.cur);let f=t,e=t;
  if(k==="7")f=addDays(t,-6);else if(k==="14")f=addDays(t,-13);
  else if(k==="m")f=new Date(t.getFullYear(),t.getMonth(),1);
  else if(k==="pm"){f=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0)}
  else if(k==="all")f=p?.start_date?new Date(p.start_date+"T00:00:00"):addDays(t,-365);
  $("rpf").value=iso(f);$("rpt").value=iso(e);
}

function rpReadCfg(){
  const p=S.projects.find(x=>x.id===S.cur),reno=isReno(p);
  return {reno,full:reno,title:$("rpn").value.trim()||(reno?"تقرير الترميم الشامل":"تقرير الإنجاز"),from:reno?"":$("rpf").value,to:reno?"":$("rpt").value,by:$("rpb").value.trim(),dur:$("rpdur")?.value.trim()||"",du:$("rpdu")?.value||"d",
    upd:$("rpu").checked,pho:$("rpp").checked,obs:$("rpo")?.checked??false,wrk:$("rpk")?.checked??false,ba:$("rpx").checked,ana:$("rpa").checked,text:$("rpw").value.trim(),price:$("rpr")?.checked??false,q:$("rpq").value,lay:$("rpl").value};
}
function rpCheck(cfg){
  if(!cfg.full){if(!cfg.from||!cfg.to)return "حدد تاريخ البداية وتاريخ النهاية";if(cfg.from>cfg.to)return "تاريخ البداية بعد تاريخ النهاية"}
  if(cfg.dur&&!(+cfg.dur>0))return "مدة التنفيذ يجب أن تكون رقماً أكبر من صفر";
  if(!cfg.upd&&!cfg.pho&&!cfg.obs&&!cfg.ana&&!cfg.ba)return "اختر محتوى واحداً على الأقل";
  return "";
}
async function rpDraftNow(){
  const cfg=rpReadCfg(),er=rpCheck(cfg);if(er)return alert(er);
  const b=$("rpd"),p=S.projects.find(x=>x.id===S.cur);b.disabled=true;b.textContent="جاري تحليل البيانات…";
  try{
    const d=await rpData(p,cfg),G=rpGroups(d,cfg),A=rpAnalyze(p,cfg,d,G);
    if(cfg.text&&!confirm("سيُستبدل النص الحالي بالمسودة. متابعة؟"))return;
    $("rpw").value=rpDraft(p,cfg,d,A,G);
  }catch(e){alert("تعذر كتابة المسودة: "+(e.message||e))}
  finally{b.disabled=false;b.textContent="✨ كتابة مسودة تلقائية"}
}
async function rpRun(){
  const cfg=rpReadCfg(),er=rpCheck(cfg);if(er)return alert(er);
  S.rep={...cfg,phase:"busy"};RP.cancel=false;render();
  try{await rpBuild(cfg)}
  catch(e){S.rep={...cfg,phase:"form"};if(e.message!=="cancel")alert("تعذر إنشاء التقرير: "+(e.message||e));render()}
}
async function rpBuild(cfg){
  const step=(pct,msg)=>{if(RP.cancel)throw new Error("cancel");const b=$("rpbar"),m=$("rpmsg");if(b)b.style.width=pct+"%";if(m)m.textContent=msg};
  const p=S.projects.find(x=>x.id===S.cur);if(!p)throw new Error("لم يتم العثور على المشروع");

  await loadLib("html2canvas.min.js?v=22");await loadLib("jspdf.umd.min.js");
  if(document.fonts){await Promise.all(["400","500","600","700","800"].map(w=>document.fonts.load(w+" 16px Tajawal","ابتثجحخدذرزسشصضطظعغفقكلمنهوىيءأإآؤئة٠١٢٣٤٥٦٧٨٩ Aa0").catch(()=>0)));await document.fonts.ready}
  step(8,"قراءة بيانات المشروع…");
  const data=await rpData(p,cfg);
  if(cfg.full){cfg.from=iso(data.f);cfg.to=iso(data.t)}

  await rpImages(p,cfg,data,(i,n)=>step(14+Math.round(i/Math.max(n,1)*32),`تجهيز الصور (${i}/${n})…`));

  try{
    const pages=rpPages(p,cfg,data,root);
    const doc=await rpPdf(p,cfg,pages,(i,n)=>step(52+Math.round(i/n*46),`إنتاج الصفحة ${i} من ${n}…`));
    step(99,"حفظ الملف…");
    const blob=doc.output("blob"),name=rpName(p,cfg);
    if(RP.url)URL.revokeObjectURL(RP.url);
    RP.blob=blob;RP.url=URL.createObjectURL(blob);
    let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:"application/pdf"})]}))}catch(e){}
    S.rep={...cfg,phase:"done",name,pages:pages.total,size:fmtSize(blob.size),canShare,fail:data.fail};render();
  }finally{root.remove()}

const rpName=(p,cfg)=>(cfg.full?`${p.name} - ${cfg.title} ${iso(new Date())}`:`${p.name} - ${cfg.title} ${cfg.from} إلى ${cfg.to}`).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim()+".pdf";
function rpDownload(){const a=document.createElement("a");a.href=RP.url;a.download=S.rep.name;document.body.appendChild(a);a.click();a.remove()}
async function rpShare(){try{await navigator.share({files:[new File([RP.blob],S.rep.name,{type:"application/pdf"})],title:S.rep.name})}catch(e){if(e.name!=="AbortError")alert("تعذرت المشاركة: "+(e.message||e))}}

/* —— البيانات —— */
async function rpData(p,cfg){
  const eod=new Date();eod.setHours(23,59,59,999);
  const f=cfg.full?new Date(0):new Date(cfg.from+"T00:00:00"),t=cfg.full?eod:new Date(cfg.to+"T23:59:59.999"),rows=[];
  for(let o=0;;o+=1000){
    const {data,error}=await sb.from("entries").select("*").eq("project_id",p.id).in("kind",["reports","media","issues"]).order("created_at",{ascending:true}).range(o,o+999);
    if(error)throw error;rows.push(...data);if(data.length<1000)break;
  }
  const d=rpClassify(rows,f,t);
  d.works=[];if(cfg.wrk){const {data:w}=await sb.from("work_items").select("*").eq("project_id",p.id).order("sort");d.works=w||[]}
  if(cfg.full){const ds=rows.map(e=>new Date(e.created_at));if(p.start_date)ds.push(new Date(p.start_date+"T00:00:00"));d.f=day0(ds.length?new Date(Math.min(...ds)):new Date())}
  return d;
}
function rpClassify(rows,f,t){
  const inP=e=>{const d=new Date(e.created_at);return d>=f&&d<=t},isImg=e=>e.file_path&&(e.file_type||"").startsWith("image");
  const issAll=rows.filter(e=>e.kind==="issues"),byId=new Map(rows.map(e=>[String(e.id),e]));
  const pairs=rows.filter(e=>e.ba==="after"&&e.ba_ref&&isImg(e)&&inP(e)).map(a=>({a,b:byId.get(String(a.ba_ref))})).filter(x=>x.b&&x.b.ba==="before"&&isImg(x.b)).sort((x,y)=>new Date(x.a.created_at)-new Date(y.a.created_at));
  return {f,t,pairs,pairIds:new Set(),
    ups:rows.filter(e=>e.kind==="reports"&&inP(e)&&cleanTxt(e.body)),
    atts:rows.filter(e=>e.kind==="reports"&&inP(e)&&e.file_path&&!isImg(e)).length,
    pics:rows.filter(e=>(e.kind==="media"||e.kind==="reports")&&isImg(e)&&inP(e)),
    iss:issAll.filter(inP),issAll,issOld:issAll.filter(e=>new Date(e.created_at)<f&&e.resolved===false),
    lastAny:rows.length?new Date(Math.max(...rows.map(e=>+new Date(e.created_at)))):null,
    img:{},fail:0,cover:""};
}
async function rpPrep(url,mode,L){
  const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);
  const u=URL.createObjectURL(await r.blob());
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=u});
    const cv=mode==="cover",W=cv?1428:L.W,H=cv?1000:L.H,c=document.createElement("canvas");c.width=W;c.height=H;
    const x=c.getContext("2d");x.fillStyle="#eef1f5";x.fillRect(0,0,W,H);
    const s=cv?Math.max(W/img.naturalWidth,H/img.naturalHeight):Math.min(W/img.naturalWidth,H/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    const out=c.toDataURL("image/jpeg",.84);c.width=c.height=0;return out;
  }finally{URL.revokeObjectURL(u)}
}
async function rpImages(p,cfg,data,prog){
  const L=LAY[cfg.lay]||LAY[2];
  const want=[...new Set([...(cfg.pho?data.pics.map(e=>e.file_path):[]),...(cfg.ba?data.pairs.flatMap(x=>[x.a.file_path,x.b.file_path]):[]),p.cover_path].filter(Boolean))],urls={};
  for(let i=0;i<want.length;i+=100){
    const {data:d}=await sb.storage.from("media").createSignedUrls(want.slice(i,i+100),3600);
    (d||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl});
  }
  const jobs=want.filter(x=>urls[x]),q=[...jobs];let done=0,fail=want.length-jobs.length;
  await Promise.all(Array.from({length:3},async()=>{
    while(q.length){const path=q.shift();
      try{data.img[path]=await rpPrep(urls[path],path===p.cover_path?"cover":"fit",L)}catch(e){fail++}
      prog(++done,jobs.length)}
  }));
  data.cover=data.img[p.cover_path]||"";
  data.pics=data.pics.filter(e=>data.img[e.file_path]);
  data.pairs=cfg.ba?data.pairs.filter(x=>data.img[x.a.file_path]&&data.img[x.b.file_path]):[];
  data.pairIds=new Set(data.pairs.flatMap(x=>[String(x.a.id),String(x.b.id)]));
  data.fail=fail;
}

/* —— التحليل —— */
function rpGroups(d,cfg){
  const f=day0(d.f),t=day0(d.t),days=Math.round((t-f)/864e5)+1,mode=cfg.full?"month":days<=10?"day":"week";
  const keyOf=dt=>{const x=day0(dt);if(mode==="day")return iso(x);if(mode==="month")return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");x.setDate(x.getDate()-x.getDay());return iso(x)};
  const all=[],map=new Map();
  let cur=mode==="day"?new Date(f):mode==="month"?new Date(f.getFullYear(),f.getMonth(),1):addDays(f,-f.getDay());
  while(cur<=t){
    const s=new Date(cur),e=mode==="day"?new Date(cur):mode==="month"?new Date(cur.getFullYear(),cur.getMonth()+1,0):addDays(cur,6);
    const b={k:keyOf(s),s,e,ups:[],pics:[]};all.push(b);map.set(b.k,b);

    const lastUp=[...d.ups].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5);
    const hd=`<div class="st" style="margin-top:12px">${reno?"آخر ما تم في المشروع":"أبرز ما تم خلال الفترة"} (${d.ups.length} تحديث${cfg.pho?` · ${d.pics.length} صورة`:""})</div>`;
    const row=e=>`<div class="ac"><span class="d">${esc(dfmt(e.created_at,{day:"numeric",month:"short"}))}</span><span>${esc(cut(cleanTxt(e.body).replace(/\n/g," "),150))}</span></div>`;

    if(d.ups.length>lastUp.length)put(`<div class="more">و${d.ups.length-lastUp.length} تحديثات أخرى في سجل الأعمال.</div>`);
  }
  /* الفريق */
  const tm2=[["مدير المشروع",p.pm_name],["المقاول",p.contractor_name],["مدير الموقع",p.site_manager],["مدير المنطقة",p.area_name]].filter(x=>x[1]);
  if(cfg.price&&p.price!=null&&p.price!=="")tm2.push(["قيمة المشروع",money(p.price)]);
  if(tm2.length)put(`<div><div class="st">فريق المشروع</div><div class="team">${tm2.map(x=>`<div><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join("")}</div></div>`);
  /* أحدث الصور */
  if(cfg.pho&&d.pics.some(e=>!d.pairIds.has(String(e.id)))){
    const ph=d.pics.filter(e=>!d.pairIds.has(String(e.id))).slice(-3).reverse(),hh=Math.round(228*LC.H/LC.W);
    const fr=e=>`<div class="pf l3"><img src="${d.img[e.file_path]}" alt="" style="height:${hh}px"><div class="pc" style="min-height:0"><small>${esc(dfmt(e.created_at))}</small></div></div>`;
    put(`<div style="margin-top:6px"><div class="st">أحدث صور الموقع</div><div class="pr l3" style="margin-bottom:12px">${ph.map(fr).join("")}${'<div class="pf" style="visibility:hidden;border:0"></div>'.repeat(3-ph.length)}</div></div>`);
  }
  /* 2) قبل وبعد (الصور التي حددها المستخدم) */
  if(cfg.ba&&d.pairs.length){
    const ph=Math.round(348*LC.H/LC.W),cp=e=>esc(cut(cleanTxt(e.body).replace(/\n/g," ")||"صورة من الموقع",90));
    const side=(e,c,t)=>`<div class="pf l2"><div class="tg ${c}">${t} · ${esc(dfmt(e.created_at))}</div><img src="${d.img[e.file_path]}" alt="" style="height:${ph}px"><div class="pc"><b>${cp(e)}</b></div></div>`;
    d.pairs.forEach((x,i)=>{
      const days=Math.max(0,Math.round((day0(x.a.created_at)-day0(x.b.created_at))/864e5));
      const row=`<div class="pr l2" style="margin-bottom:6px">${side(x.b,"bf","قبل")}${side(x.a,"af","بعد")}</div><div class="bagap">المدة بين الصورتين: ${days===0?"في نفس اليوم":days+" يوماً"}</div>`;
      put(i?`<div>${row}</div>`:`<div>${sec("قبل وبعد")}<div class="st">مقارنة بين حالة الموقع قبل العمل وبعده</div>${row}</div>`);
      if(!i)mark();
    });
  }
  /* 3) التقرير المكتوب */
  if(cfg.ana){
    const wb=rpWriteBlocks(cfg.text||rpDraft(p,cfg,d,A,G));
    if(wb.length){
      let pend="",tf=true;
      const flush=h2=>{const t=tf?sec("التقرير المكتوب"):"";put(`<div>${t}${h2}</div>`);if(tf){mark();tf=false}};
      wb.forEach(b=>{if(b.startsWith('<div class="wh"')){pend+=b;return}flush(pend+b);pend=""});
      if(pend)flush(pend);
    }
  }
  /* سجل الأعمال */
  let un=0,pn=0;
  const upHtml=(e,n,txt,cont)=>`<div class="uc"><div class="mt"><i>${String(n).padStart(2,"0")}</i><b>${esc(tfmt(e.created_at))}</b>${e.author_role?`<span>· ${esc(ROLES[e.author_role]||e.author_role)}</span>`:""}${cont?"<span>· (تابع)</span>":""}</div><p>${esc(txt)}</p>${!cont&&e.file_path&&!(e.file_type||"").startsWith("image")?'<div class="at">مرفق: ملف مرفوع مع هذا التحديث</div>':""}</div>`;
  const picCard=(e,n)=>`<div class="pf l${LY}"><img src="${d.img[e.file_path]}" alt=""><div class="pc"><b><i>${String(n).padStart(2,"0")}</i>${esc(cut(cleanTxt(e.body).replace(/\n/g," ")||"صورة من الموقع",LC.cap))}</b><small>${esc(dfmt(e.created_at))} · ${esc(tfmt(e.created_at))}</small></div></div>`;
  const picRows=arr=>{const rows=[];for(let i=0;i<arr.length;i+=LC.n){let h="";for(let j=0;j<LC.n;j++){const e=arr[i+j];h+=e?picCard(e,++pn):'<div class="pf" style="visibility:hidden;border:0"></div>'}rows.push(`<div class="pr l${LY}">${h}</div>`)}return rows};
  if(G.list.length){
    let ttl=sec(reno?"سجل أعمال الترميم":"سجل الأعمال"),firstPut=true;
    const putT=h=>{put(h);if(firstPut){mark();firstPut=false}};
    G.list.forEach(g=>{
      const head=ttl+`<div class="gh"><div><small>${esc(g.tag)}</small><b>${esc(g.label)}</b></div><div class="cn">${cfg.upd?`<span>${g.ups.length} تحديث</span>`:""}${cfg.pho?`<span>${g.pics.length} صورة</span>`:""}</div></div>`;
      const items=[];
      g.ups.forEach(e=>{const ch=rpChunks(cleanTxt(e.body));un++;ch.forEach((c,i)=>items.push(upHtml(e,un,c,i>0)))});
      ttl="";let first=true;
      items.forEach(h=>{if(first){putT(`<div>${head}${h}</div>`);first=false}else put(h)});
      if(g.pics.length){
        picRows(g.pics).forEach((r,i)=>{
          if(i===0){const lead=first?head:"";first=false;putT(`<div>${lead}<div class="st">صور الأعمال</div>${r}</div>`)}else put(r);
        });
      }
      if(first)putT(head);
    });
  }else if(cfg.upd||cfg.pho)put(`<div class="em">لا توجد تحديثات أو صور مسجلة ${reno?"في المشروع":"في هذه الفترة"}.</div>`);
  /* المعوقات */
  if(cfg.obs&&(d.iss.length||d.issOld.length)){
    const oc=e=>{const [c,l]=rpStatus(e);return `<div class="oc"><div class="bd ${c}">${l}</div><div class="tx"><p>${esc(cleanTxt(e.body))}</p><small>سُجّل ${esc(dfmt(e.created_at))}${e.resolved&&e.resolved_at?` · حُلّ ${esc(dfmt(e.resolved_at))}`:""}${e.author_role?` · ${esc(ROLES[e.author_role]||e.author_role)}`:""}</small></div></div>`};
    let ot=sec("سجل المعوقات"),op=true;
    const lst=(title,arr)=>arr.forEach((e,i)=>{put(i?oc(e):`<div>${ot}<div class="st">${title} (${arr.length})</div>${oc(e)}</div>`);if(!i&&op){mark();op=false}ot=""});
    if(d.iss.length)lst(reno?"جميع المعوقات المسجلة":"معوقات سُجّلت خلال الفترة",d.iss);
    if(d.issOld.length)lst("معوقات مفتوحة من فترات سابقة",d.issOld);
  }
  /* الاعتماد */
  const pBox=box,pEl=box.lastElementChild;
  const sgEl=put(`<div class="sg"><div><b>أعدّه</b>${by||"&nbsp;"}<div class="ln">التوقيع / التاريخ</div></div><div><b>راجعه</b>&nbsp;<div class="ln">التوقيع / التاريخ</div></div><div><b>اعتمده</b>&nbsp;<div class="ln">التوقيع / التاريخ</div></div></div>`);
  if(box!==pBox&&pEl&&pEl.parentNode===pBox){pBox.removeChild(pEl);box.insertBefore(pEl,sgEl)}
  /* الفهرس */
  tocEl.innerHTML=marks.filter(m=>m[2]).map(m=>`<span><b>${m[0]}.</b> ${m[1].split(" ").map(w=>`<b><u>${w}</u></b>`).join("")}<em>ص ${m[2]}</em></span>`).join("");
  pages.total=pages.length;return pages;
}
async function rpPdf(p,cfg,pages,prog){
  /* تعطيل Intl.Segmenter: تقسيمه للنص العربي على بعض الجوالات يقطّع الحروف؛ المكتبة تستخدم بديلها الداخلي */
  try{Intl.Segmenter=undefined}catch(e){}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"p",unit:"pt",format:"a4",compress:true}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const sc=cfg.q==="hi"?2:1.4,ql=cfg.q==="hi"?.9:.8,N=pages.length;
  pages.forEach((pg,i)=>{const n=pg.querySelector(".pnum");if(n)n.textContent=`صفحة ${i+1} من ${N} · v24`});
  for(let i=0;i<N;i++){
    if(RP.cancel)throw new Error("cancel");
    prog(i+1,N);
    const cv=await html2canvas(pages[i],{scale:sc,backgroundColor:"#ffffff",logging:false,useCORS:true,windowWidth:1280,windowHeight:1280,onclone:(d)=>{const st=d.createElement("style");st.textContent=".rpg,.rpg *{overflow-wrap:normal!important;word-break:normal!important;letter-spacing:0!important;word-spacing:0!important;-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important;text-rendering:optimizeLegibility;font-kerning:normal;font-variant-ligatures:normal}";d.head.appendChild(st)}});
    if(i)doc.addPage();
    doc.addImage(cv.toDataURL("image/jpeg",ql),"JPEG",0,0,W,H,undefined,"FAST");
    cv.width=cv.height=0;pages[i].remove();
    await new Promise(r=>setTimeout(r,0));
  }
  doc.setProperties({title:`${p.name} - ${cfg.title}`,subject:cfg.full?"تقرير شامل":`${cfg.from} → ${cfg.to}`,author:cfg.by||"إدارة المشاريع",creator:"إدارة المشاريع",keywords:rpRef(p)});
  return doc;
}

/* تحديث الطلب: يحفظ، يشعر الأدوار المعنية، يعيد التحميل، ويغلق النافذة (إلا إذا keep) */
async function mUpd(id,patch,ev,roles,pt,o){
  o=o||{};const t=mT(id);if(!t)return false;
  if(patch.stage&&patch.stage!==t.stage)patch.stage_at=mNow();
  const {error}=await sb.from("mnt_requests").update(patch).eq("id",id);

}
async function mUploadFiles(t,fs,phase){

    if((f.type||"").startsWith("video/")){alert("الفيديو غير متاح في الصيانة");continue}

    if(await mEvent(t,"photo",null,phase,{path,type:f.type||"image/jpeg"}))n++;
  }
  return n;
}

/* ===== تنظيف الصور اليتيمة (ملفات في التخزين لا يشير إليها أي سجل) — للمدير فقط ===== */
const ORPH_GRACE_H=24;   // لا نلمس الملفات الأحدث من 24 ساعة (قد تكون قيد الرفع)
function fmtSz(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1)+" ميجا":Math.max(1,Math.round(n/1024))+" كيلوبايت"}
function openOrph(){S.orph={st:"idle",list:[],bytes:0,total:0,msg:""};modal("orph")}
async function listAllFiles(){
  const bk=sb.storage.from("media"),files=[];
  const page=async prefix=>{const out=[];for(let o=0;;o+=1000){
    const {data,error}=await bk.list(prefix,{limit:1000,offset:o,sortBy:{column:"name",order:"asc"}});
    if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break}return out};
  const top=await page("");
  for(const it of top){
    if(it.id){files.push({path:it.name,size:it.metadata?.size||0,at:it.created_at||it.updated_at});continue}
    for(const f of await page(it.name)){if(f.id)files.push({path:it.name+"/"+f.name,size:f.metadata?.size||0,at:f.created_at||f.updated_at})}
  }
  return files;
}
async function scanOrph(){
  S.orph={st:"scan",list:[],bytes:0,total:0,msg:""};render();
  try{
    const refs=new Set();
    for(let o=0;;o+=1000){
      const {data,error}=await sb.from("entries").select("file_path").not("file_path","is",null).range(o,o+999);
      if(error)throw error;(data||[]).forEach(e=>refs.add(e.file_path));if(!data||data.length<1000)break}
    const {data:pr,error:pe}=await sb.from("projects").select("cover_path");if(pe)throw pe;
    for(const tb of ["mnt_events","maint_events"])for(let o=0;;o+=1000){   /* صور الصيانة (الجديد + الأرشيف القديم): إذا الجدول غير موجود نتجاهله، وأي خطأ آخر يوقف الفحص */
      const {data,error}=await sb.from(tb).select("file_path").not("file_path","is",null).range(o,o+999);
      if(error){if(/does not exist|schema cache|PGRST205|42P01/i.test(error.message+(error.code||"")))break;throw error}
      (data||[]).forEach(e=>refs.add(e.file_path));if(!data||data.length<1000)break}
    (pr||[]).forEach(p=>{if(p.cover_path)refs.add(p.cover_path)});
    const files=await listAllFiles(),now=Date.now();
    const orph=files.filter(f=>!refs.has(f.path)&&(!f.at||now-new Date(f.at).getTime()>ORPH_GRACE_H*3600e3));
    /* حماية: إذا ما وجدنا أي مرجع إطلاقا والتخزين فيه ملفات، غالبا الصلاحيات ناقصة، لا نعرض شيئا للحذف */
    if(!refs.size&&files.length)throw new Error("لم تُقرأ سجلات الملفات (تحقق من الصلاحيات). تم إيقاف التنظيف للأمان.");
    S.orph={st:"ready",list:orph,bytes:orph.reduce((s,f)=>s+f.size,0),total:files.length,msg:""};
  }catch(e){S.orph={st:"idle",list:[],bytes:0,total:0,msg:"تعذر الفحص: "+(e.message||e)}}
  render();
}
async function delOrph(){
  const O=S.orph;if(!O.list.length)return;
  if(!confirm(`حذف ${O.list.length} ملف يتيم (${fmtSz(O.bytes)}) نهائيا؟ لا يمكن التراجع.`))return;
  S.orph={...O,st:"del"};render();
  let ok=0,err="";
  for(let i=0;i<O.list.length;i+=100){
    const ch=O.list.slice(i,i+100).map(f=>f.path);
    const {data,error}=await sb.storage.from("media").remove(ch);
    if(error){err=error.message;break}ok+=(data||[]).length}
  logA("entry",`تنظيف الصور اليتيمة: حُذف ${ok} ملف (${fmtSz(O.bytes)})`,null);
  S.orph={st:"done",list:[],bytes:0,total:0,msg:err?`حُذف ${ok} ثم توقف: ${err}`:`تم حذف ${ok} ملف وتحرير ${fmtSz(O.bytes)} ✅`};
  render();
}
function orphHtml(){
  const O=S.orph||{st:"idle",list:[],bytes:0,msg:""};
  let body;
  if(O.st==="scan"||O.st==="del")body=`<p class="lbl">${O.st==="scan"?"جاري فحص التخزين...":"جاري الحذف..."}</p>`;

  return `<div class="modal"><div class="box"><h3>🧹 تنظيف المساحة</h3>${body}<div style="margin-top:14px"><button class="btn alt" onclick="modal(null)">إغلاق</button></div></div></div>`;

/* ===== طابور الرفع بدون إنترنت (IndexedDB) ===== */
const QDB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("pm-queue",1);r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction("q",m),r=f(t.objectStore("q"));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{put:v=>tx("readwrite",s=>s.put(v)),all:()=>tx("readonly",s=>s.getAll()),del:id=>tx("readwrite",s=>s.delete(id)),clear:()=>tx("readwrite",s=>s.clear())};
})();
async function qAdd(it,noRender){
  it.id=crypto.randomUUID();it.ts=Date.now();
  try{await QDB.put(it)}catch(e){alert("تعذر الحفظ على الجهاز: "+(e&&e.message||e));if(!noRender)render();return}
  await qUpd();
  alert("لا يوجد اتصال مستقر. حُفظ العنصر على جهازك وسيُرفع تلقائيا عند عودة الإنترنت.");
  if(!noRender)render();
}
async function qUpd(){
  let n=0;try{n=(await QDB.all()).length}catch(e){}
  let b=$("qb");
  if(!n){if(b)b.remove();return}

async function qClear(){if(!confirm("حذف كل العناصر المعلّقة من الجهاز دون رفعها؟"))return;try{await QDB.clear()}catch(e){}qUpd()}
async function syncQ(){
  if(syncQ.b||!navigator.onLine||!S.user)return;syncQ.b=true;let ok=0;
  try{
    const L=(await QDB.all()).sort((a,b)=>a.ts-b.ts);
    for(const it of L){
      const base={project_id:it.project_id,kind:it.kind,author_role:it.author_role},rows=[],ups=[];let bad=false;
      if(!it.files.length)rows.push({...base,body:it.body,file_path:null,file_type:null});
      else for(const f of it.files){const path=await up(it.project_id,f,true);if(!path||path==="NET"){bad=true;break}ups.push(path);rows.push({...base,body:it.body,file_path:path,file_type:f.type,...(it.bax||{})})}
      if(bad){if(ups.length)await sb.storage.from("media").remove(ups);break}
      const {error}=await sb.from("entries").insert(rows);
      if(error){if(ups.length)await sb.storage.from("media").remove(ups);break}
      await QDB.del(it.id);ok++;
      logA("entry",`${(TABS.find(x=>x.k===it.kind)||{}).n||""}: ${it.files.length?it.files.length+" ملف":String(it.body||"").slice(0,60)} (رُفع بعد عودة الاتصال)`,it.project_id);
    }
  }catch(e){}
  finally{syncQ.b=false}
  await qUpd();
  if(ok){
    if(S.cur&&S.tab!=="works"){try{await loadE()}catch(e){}}
    const ae=document.activeElement;if(!S.modal&&!(ae&&/TEXTAREA|INPUT|SELECT/.test(ae.tagName)))render();
  }
}

async function addE(){
  const body=$("tx").value.trim(),fs=[...($("fl")?.files||[])];
  if(!body&&!fs.length)return;
  const isVid=f=>(f.type&&f.type.startsWith("video/"))||/\.(mp4|mov|m4v|avi|mkv|webm|3gp|wmv)$/i.test(f.name||"");
  if(fs.some(isVid))return alert("رفع الفيديو غير متاح في الموقع للحفاظ على المساحة. صوّر لقطات من الفيديو، أو ارفعه في OneDrive وألصق رابطه في الملاحظة.");
  const bigF=fs.find(f=>!(f.type&&f.type.startsWith("image/"))&&f.size>5*1024*1024);
  if(bigF)return alert("حجم الملف "+(bigF.size/1048576).toFixed(1)+" ميجا والحد المسموح 5 ميجا. ارفعه في OneDrive وألصق رابطه في الملاحظة.");
  const bat=$("bat")?.value||"";
  if(bat){
    if(!fs.length)return alert("ارفع صورة لتحديد قبل / بعد");
    if(fs.some(f=>!f.type.startsWith("image")))return alert("تحديد قبل / بعد للصور فقط");
    if(bat==="after"&&!S.baSel)return alert("اختر صورة «قبل» التي تقابلها هذه الصور");
  }
  const bax=bat?{ba:bat,ba_ref:bat==="after"?S.baSel:null}:{};
  $("bt").disabled=true;
  const base={project_id:S.cur,kind:S.tab,author_role:ROLES[S.role]},rows=[];
  if(!navigator.onLine)return qAdd({...base,body,bax,files:fs});
  if(!fs.length)rows.push({...base,body,file_path:null,file_type:null});
  {const res=new Array(fs.length);let nx=0,dn=0;
  await Promise.all(Array.from({length:Math.min(3,fs.length)},async()=>{
    while(nx<fs.length){const i=nx++;res[i]=await up(S.cur,fs[i],true);$("bt").textContent=`جاري رفع ${++dn} من ${fs.length}...`}
  }));
  const net=[];res.forEach((path,i)=>{if(path==="NET")net.push(fs[i]);else if(path)rows.push({...base,body,file_path:path,file_type:fs[i].type,...bax})});if(net.length)await qAdd({...base,body,bax,files:net},true);}
  if(!rows.length)return render();
  const {error}=await sb.from("entries").insert(rows);
  if(error&&!fs.length&&isNetErr(error)){await qAdd({...base,body,bax,files:[]});return}
  if(error)alert(error.message.includes("ba")?"لم يتم تفعيل قبل/بعد في قاعدة البيانات بعد. شغّل ملف before-after.sql في Supabase ثم أعد المحاولة.":error.message);
  if(!error)logA("entry",`${(TABS.find(x=>x.k===S.tab)||{}).n||""}: ${fs.length?fs.length+" ملف":body.slice(0,60)}`);
  S.baSel=null;
  await loadE();render();
}
async function delE(id){
  if(!confirm("حذف؟"))return;
  const e=S.entries.find(x=>x.id===id);
  logA("entry","حذف من "+((TABS.find(x=>x.k===S.tab)||{}).n||"")+": "+String((e&&e.body)||"").slice(0,40));
  if(e?.file_path)await sb.storage.from("media").remove([e.file_path]);
  await sb.from("entries").delete().eq("id",id);await loadE();render();
}

async function openPricing(){
  S.price={loading:true,error:"",resources:[],recipes:[],qty:1,recipe:""};modal("pricing");
  const [a,b]=await Promise.all([sb.from("price_resources").select("code,kind,name,unit,price,src"),sb.from("price_recipes").select("code,section,name,unit,comps,pub").eq("pub",true).order("section").order("name")]);
  S.price.loading=false;
  if(a.error||b.error){S.price.error=(a.error||b.error).message;render();return}
  S.price.resources=a.data||[];S.price.recipes=b.data||[];S.price.recipe=S.price.recipes[0]?.code||"";render();
}
function priceCost(code,qty=1,seen=[]){
  const res=S.price?.resources.find(x=>x.code===code);if(res)return Number(res.price||0)*qty;
  const r=S.price?.recipes.find(x=>x.code===code);if(!r||seen.includes(code))return 0;
  return (r.comps||[]).reduce((n,c)=>n+priceCost(c.r,qty*Number(c.q||0),[...seen,code]),0);
}
function pricingHtml(){
  const x=S.price||{};

  if(x.error)return `<div class="modal"><div class="box"><h3>💰 التسعير</h3><div class="hlq">تعذر تحميل بيانات التسعير. شغّل ملف <b>pricing.sql</b> في محرر SQL داخل Supabase، ثم أعد المحاولة.<br><small dir="ltr">${esc(x.error)}</small></div><button class="btn" onclick="openPricing()">إعادة المحاولة</button> <button class="btn alt" onclick="modal(null)">إغلاق</button></div></div>`;
  const r=x.recipes.find(v=>v.code===$("prcode")?.value)||x.recipes.find(v=>v.code===x.recipe),q=Math.max(0,Number($("prqty")?.value??x.qty)||0),cost=r?priceCost(r.code,q):0;
  return `<div class="modal"><div class="box" style="max-width:620px"><h3>💰 التسعير بالتحليل</h3><label class="lbl">بند التسعير</label><select id="prcode" onchange="S.price.recipe=this.value;render()">${x.recipes.map(v=>`<option value="${esc(v.code)}" ${v.code===(r?.code||x.recipe)?"selected":""}>${esc(v.section)} · ${esc(v.name)} (${esc(v.unit)})</option>`).join("")}</select>${r?`<label class="lbl">الكمية (${esc(r.unit)})</label><input id="prqty" type="number" min="0" step="any" value="${q}" onchange="S.price.qty=this.value;render()"><div class="box" style="background:#f4f6fa;margin:8px 0"><span>سعر الوحدة التقديري</span><b>${priceCost(r.code,1).toLocaleString("ar-SA",{maximumFractionDigits:2})} ر.س</b><br><span>الإجمالي التقديري</span><b style="font-size:22px">${cost.toLocaleString("ar-SA",{maximumFractionDigits:2})} ر.س</b></div>`:'<div class="empty">لا توجد وصفات تسعير متاحة.</div>'}<details><summary>الموارد والأسعار (${x.resources.length})</summary>${x.resources.map(v=>`<div class="item">${esc(v.name)} · ${Number(v.price).toLocaleString("ar-SA")} ر.س / ${esc(v.unit)} <small>${esc(v.src||"")}</small></div>`).join("")}</details><button class="btn alt" onclick="modal(null)">إغلاق</button></div></div>`;

/* ===== إدارة الحسابات وحذفها (المالك فقط) ===== */
async function openUsers(){const {data,error}=await sb.rpc("list_users");if(error)return alert(error.message);S.users=data||[];modal("users")}
function usersHtml(){
  const L=S.users||[];
  return `<div class="modal"><div class="box"><h3>الحسابات (${L.length})</h3>
  <div class="acts"><button class="btn" onclick="modal('invp')">＋ مدير مشروع</button><button class="btn" onclick="modal('invm')">＋ الإدارة</button><button class="btn" onclick="modal('invs')">＋ مدير موقع</button></div>
  ${L.map(u=>`<div class="item"><b dir="ltr">${esc(u.username)}</b> · ${ROLES[u.role]||"بدون دور"}${u.role==="owner"?"":` <button class="sm del" onclick="delUser('${u.id}')">حذف</button>`}</div>`).join("")}
  <button class="btn alt" style="margin-top:14px" onclick="modal(null)">إغلاق</button></div></div>`;
}
async function delUser(id){
  const u=(S.users||[]).find(x=>x.id===id);
  if(!confirm("حذف الحساب «"+(u?.username||"")+"» نهائياً؟"))return;
  const {error}=await sb.rpc("delete_user",{uid:id});
  if(error)return alert(error.message);
  await openUsers();
}

const tel=(l,n)=>n?`<div><span>${l}</span><b dir="ltr"><a href="tel:+${esc(n)}">${esc(n)}</a></b></div>`:"";
/* ===== 8) تثبيت التطبيق على الجوال ===== */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let DP=null;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function installBar(msg,btn=""){
  if(standalone||$("ib"))return;
  try{if(localStorage.getItem("ib0"))return}catch(e){}
  const d=document.createElement("div");d.id="ib";
  d.style.cssText="position:fixed;bottom:12px;left:12px;right:12px;z-index:50;background:#0f2742;color:#fff;padding:12px 14px;border-radius:14px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 6px 20px #0006";
  d.innerHTML=`<span style="flex:1">${msg}</span>${btn}<button onclick="closeIb()" style="background:none;border:0;color:#fff;font-size:20px;cursor:pointer">✕</button>`;
  document.body.appendChild(d);
}
function closeIb(){$("ib")?.remove();try{localStorage.setItem("ib0","1")}catch(e){}}
addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();DP=e;
  installBar("ثبّت التطبيق على جوالك","<button class='btn' onclick='DP.prompt();closeIb()'>تثبيت</button>");
});
if(/iphone|ipad|ipod/i.test(navigator.userAgent))
  installBar("للتثبيت: اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»");

init();
</script>
