<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المشاريع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2742;--bg:#f4f6fa;--card:#fff;--text:#1b2a3b;--muted:#64748b;--line:#e2e8f0;
--run:#2563eb;--late:#dc2626;--plan:#d97706;--done:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}
header span{font-size:14px;opacity:.8}
.wrap{max-width:1100px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border-radius:16px;padding:20px;cursor:pointer;border-top:6px solid var(--c);box-shadow:0 4px 14px #0f274212;transition:.2s}
.stat.on{outline:3px solid var(--c)}
.stat b{display:block;font-size:44px;line-height:1.1;color:var(--c);font-weight:800}
.stat span{font-size:16px;color:var(--muted);font-weight:500}
.s-run{--c:var(--run)}.s-late{--c:var(--late)}.s-plan{--c:var(--plan)}.s-done{--c:var(--done)}
h2{margin:30px 0 14px;font-size:22px}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #0f274214;display:block;color:inherit;text-decoration:none}
.img{height:260px;background-size:cover;background-position:center;position:relative}
.badge{position:absolute;top:14px;right:14px;background:var(--c);color:#fff;padding:5px 16px;border-radius:20px;font-size:14px;font-weight:700}
.body{padding:18px}
.body h3{margin:0 0 4px;font-size:21px}
.body p{margin:0;color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:8px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:8px}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.img{height:320px}}
</style>
</head>
<body>
<header><h1>إدارة المشاريع</h1><span>لوحة المالك</span></header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <h2 id="title">كل المشاريع</h2>
  <div class="grid" id="grid"></div>
</div>
<script>
const STATUS={
  run:{label:"قيد التنفيذ",cls:"s-run"},
  late:{label:"متأخر",cls:"s-late"},
  plan:{label:"التصميم والتخطيط",cls:"s-plan"},
  done:{label:"تم التسليم",cls:"s-done"}
};
// مشاريع تجريبية: غيّر الاسم والموقع والنسبة، وحط رابط صورة حقيقية بدل img
const PROJECTS=[
  {name:"مشروع فيلا الأول",loc:"الرياض",status:"run",progress:62,due:"2026-12-01",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=900"},
  {name:"مجمع سكني",loc:"جدة",status:"late",progress:45,due:"2026-09-15",img:"https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=900"},
  {name:"برج مكتبي",loc:"الدمام",status:"plan",progress:15,due:"2027-06-01",img:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=900"},
  {name:"مبنى تجاري",loc:"الخبر",status:"done",progress:100,due:"2026-06-20",img:"https://images.unsplash.com/photo-1497366216548-37526070297c?w=900"}
];
let filter=null;
function render(){
  document.getElementById("stats").innerHTML=Object.keys(STATUS).map(k=>{
    const n=PROJECTS.filter(p=>p.status===k).length;
    return `<div class="stat ${STATUS[k].cls} ${filter===k?'on':''}" onclick="setF('${k}')"><b>${n}</b><span>${STATUS[k].label}</span></div>`;
  }).join("");
  const list=PROJECTS.filter(p=>!filter||p.status===filter);
  document.getElementById("title").textContent=filter?STATUS[filter].label:"كل المشاريع";
  document.getElementById("grid").innerHTML=list.length?list.map(p=>`
    <a class="card ${STATUS[p.status].cls}" href="#">
      <div class="img" style="background-image:url('${p.img}')"><span class="badge">${STATUS[p.status].label}</span></div>
      <div class="body"><h3>${p.name}</h3><p>${p.loc}</p>
      <div class="bar"><i style="width:${p.progress}%"></i></div>
      <div class="row"><span>الإنجاز ${p.progress}%</span><span>التسليم ${p.due}</span></div></div>
    </a>`).join(""):'<div class="empty">لا توجد مشاريع</div>';
}
function setF(k){filter=filter===k?null:k;render()}
render();
</script>
</body>
</html>
